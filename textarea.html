<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Textarea Dinâmico</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background: #f8f8f8;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      textarea {
        min-height: 24px;
        max-height: 120px; /* 5 linhas de 24px */
        line-height: 24px;
        padding: 6px;
        font-size: 14px;
        resize: none;
        overflow-y: hidden;
        box-sizing: border-box;
        border-radius: 4px;
        border: 1px solid #ccc;
        transition: height 0.1s ease-in-out;
        background-color: #fff;
      }
    </style>
  </head>
  <body>
    <label for="comentario">Comentário:</label>
    <textarea id="comentario" rows="1" cols="50" oninput="autoExpand(this)">
    joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego joao da rocha labrego 
    </textarea>

    <script>
      function autoExpand(el) {
        const lineHeight = 24; // mesmo valor usado no CSS
        const maxLines = 5;
        const maxHeight = lineHeight * maxLines;

        el.style.height = "auto";
        el.style.overflowY = "hidden";

        const newHeight = el.scrollHeight;
        if (newHeight > maxHeight) {
          el.style.height = maxHeight + "px";
          el.style.overflowY = "auto";
        } else {
          el.style.height = newHeight + "px";
        }
      }
      autoExpand(document.getElementById("comentario"));
    </script>
  </body>
</html>
