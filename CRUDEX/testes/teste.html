<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .vertical-range {
        writing-mode: bt-lr; /* vertical, de baixo pra cima */
        -webkit-appearance: slider-vertical; /* necessário no Chrome */
        width: 8px; /* largura da faixa */
        height: 200px; /* altura do controle */
      }
    </style>
  </head>
  <body>
    <input type="range" min="0" max="100" value="50" class="vertical-range" />
  </body>
</html>
