<style>
  .container {
    display: flex;
    align-items: center;
  }

  table {
    border-collapse: collapse;
    font-family: sans-serif;
  }

  td,
  th {
    border: 1px solid #ccc;
    padding: 5px;
  }

  .range-container {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 300px;
    width: 2px;
    padding-left: 5px; /* afastamento natural da tabela */
  }

  .range-container input[type="range"] {
    transform: rotate(-270deg);
    transform-origin: center center;
    display: block;
    /* tira qualquer valor fixo de width */
    width: auto;
  }
</style>

<div class="container">
  <table>
    <tr>
      <th>Item</th>
      <th>Valor</th>
    </tr>
    <tr>
      <td>Produto A</td>
      <td>10</td>
    </tr>
    <tr>
      <td>Produto B</td>
      <td>20</td>
    </tr>
    <tr>
      <td>Produto C</td>
      <td>30</td>
    </tr>
  </table>
  <div class="range-container">
    <input type="range" min="0" max="100" value="50" />
  </div>
</div>
<script>
  window.onload = () => {
    const table = document.querySelector("table");
    const range = document.querySelector(
      ".range-container input[type='range']"
    );
    const tableHeight = table.offsetHeight;
    range.style.width = tableHeight + "px";
  };
</script>
