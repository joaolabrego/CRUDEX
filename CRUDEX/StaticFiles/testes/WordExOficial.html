<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>
      WordEx – Class (limpo) – Word-like + Toolbar + Imagem dentro do &lt;p&gt;
    </title>

    <style>
      :root {
        --page-w: 210mm;
        --page-h: 297mm;

        --margin: 20mm;
        --header-h: 28mm;
        --footer-h: 24mm;

        --guide: #777;
        --tag-bg: #e6e6e6;
        --tag-bd: #777;
      }
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #111;
        font-family:
          system-ui,
          Segoe UI,
          Arial;
        overflow: hidden;
      }

      .topbar {
        padding: 10px;
        background: #000;
        color: #fff;
        display: flex;
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
        flex-wrap: wrap;
      }
      .topbar button {
        margin-right: 6px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 10px;
        border-left: 1px solid rgba(255, 255, 255, 0.18);
      }

      .toolbar button {
        background: #1b1b1b;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .toolbar button:hover {
        background: #2a2a2a;
      }

      .toolbar select,
      .toolbar input[type="color"] {
        height: 28px;
      }

      .mode-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border: 1px solid #333;
        border-radius: 999px;
        font-size: 12px;
        opacity: 0.95;
      }
      .mode-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #39ff14;
        box-shadow: 0 0 12px rgba(57, 255, 20, 0.95);
      }
      .mode-pill.ovr .mode-dot {
        background: #ff0033;
        box-shadow: 0 0 12px rgba(255, 0, 51, 0.95);
      }

      .wrap {
        height: calc(100vh - 58px);
        overflow: auto;
        padding: 6px;
      }
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .page {
        width: var(--page-w);
        height: var(--page-h);
        background: #fff;
        border: 1px solid #cfcfcf;
        position: relative;
        transform: scale(1.05);
        transform-origin: top center;
      }

      .page-inner {
        position: absolute;
        inset: var(--margin);
        display: flex;
        flex-direction: column;
        border: none;
        overflow: hidden;
      }

      .band {
        position: relative;
        padding: 0;
        cursor: text;
      }

      .header {
        min-height: var(--header-h);
        height: auto;
      }
      .footer {
        min-height: var(--footer-h);
        height: auto;
      }
      .body {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .band .editable {
        padding: 6mm;
        outline: none;
        height: auto;
        overflow: visible;
        color: #111;
      }

      .editable.editing {
        background: transparent;
        outline: none;
        border-radius: 0;
        padding: 6mm;
        caret-color: #39ff14;
      }
      .editable.editing.ovr-caret {
        caret-color: #ff0033;
      }

      p {
        margin: 0 0 6px 0;
      }

      /* Labels só no modo HF */
      .band-label {
        display: none;
      }

      /* ===== HF: linha tracejada como BACKGROUND ===== */
      .page.hf .header {
        position: relative;
        background-image: repeating-linear-gradient(
          to right,
          var(--guide) 0 6px,
          transparent 6px 12px
        );
        background-repeat: repeat-x;
        background-size: 12px 1px;
        background-position: left 100%;
      }
      .page.hf .footer {
        position: relative;
        background-image: repeating-linear-gradient(
          to right,
          var(--guide) 0 6px,
          transparent 6px 12px
        );
        background-repeat: repeat-x;
        background-size: 12px 1px;
        background-position: left 0%;
      }

      .page.hf .header .band-label {
        display: inline-block;
        position: absolute;
        left: 14px;
        bottom: 0;
        transform: translateY(50%);
        font-size: 12px;
        line-height: 1;
        background: var(--tag-bg);
        border: 1px solid var(--tag-bd);
        border-radius: 2px;
        padding: 3px 10px;
        user-select: none;
        pointer-events: none;
        z-index: 2;
      }
      .page.hf .footer .band-label {
        display: inline-block;
        position: absolute;
        left: 14px;
        top: 0;
        transform: translateY(-50%);
        font-size: 12px;
        line-height: 1;
        background: var(--tag-bg);
        border: 1px solid var(--tag-bd);
        border-radius: 2px;
        padding: 3px 10px;
        user-select: none;
        pointer-events: none;
        z-index: 2;
      }

      /* corpo apagado no modo HF */
      .page.hf .body {
        opacity: 0.45;
      }
      .page.hf .body * {
        pointer-events: none;
      }

      /* ===== IMAGEM dentro do <p> ===== */
      .rx-img {
        display: inline-block;
        vertical-align: baseline;
        max-width: 100%;
        height: auto;
        width: var(--iw, 80px);
      }
      .rx-img.sel {
        outline: 2px solid rgba(57, 255, 20, 0.85);
        outline-offset: 2px;
      }

      /* ===== TABELA (inline, dentro do <p>) ===== */
      .rx-tbl-wrap {
        display: inline-block;
        vertical-align: baseline;
        user-select: none; /* evita seleção de texto na tabela */
      }

      .rx-tbl-wrap.sel-table {
        outline: 2px solid rgba(57, 255, 20, 0.85);
        outline-offset: 2px;
      }
      .rx-tbl tr.sel-row > td {
        outline: 2px solid rgba(57, 255, 20, 0.85);
        outline-offset: -2px;
      }

      .rx-tbl {
        border-collapse: collapse;
        border-spacing: 0;
        font-size: inherit;
      }
      .rx-tbl td {
        border: 1px solid #999;
        padding: 2px 6px;
        min-width: 28px;
        height: 22px;
        user-select: text; /* se quiser permitir selecionar dentro da célula */
      }
      .rx-tbl tr.sel {
        outline: 2px solid rgba(57, 255, 20, 0.85);
        outline-offset: 2px;
      }

      .rx-tbl td.sel-cell {
        outline: 2px solid rgba(57, 255, 20, 0.85);
        outline-offset: -2px;
      }
    </style>
  </head>

  <body>
    <div class="topbar">
      <div class="toolbar">
        <span id="modePill" class="mode-pill" title="Tecla INS alterna modo">
          <span class="mode-dot"></span>
          <strong id="modeText">INS</strong>
        </span>

        <button id="tbBold" title="Negrito"><b>B</b></button>
        <button id="tbItalic" title="Itálico"><i>I</i></button>
        <button id="tbUnder" title="Sublinhado"><u>U</u></button>
        <button id="tbClear" title="Limpar formatação">Tx</button>

        <button id="tbLeft" title="Alinhar à esquerda">⟸</button>
        <button id="tbCenter" title="Centralizar">≡</button>
        <button id="tbRight" title="Alinhar à direita">⟹</button>
        <button id="tbJust" title="Justificar">☰</button>

        <select id="tbFont" title="Fonte">
          <option value="">Fonte</option>
          <option>Arial</option>
          <option>Times New Roman</option>
          <option>Calibri</option>
          <option>Courier New</option>
          <option>Georgia</option>
          <option>Verdana</option>
        </select>

        <select id="tbSize" title="Tamanho">
          <option value="">Tam</option>
          <option value="1">8</option>
          <option value="2">10</option>
          <option value="3">12</option>
          <option value="4">14</option>
          <option value="5">18</option>
          <option value="6">24</option>
          <option value="7">36</option>
        </select>

        <input id="tbColor" type="color" title="Cor" />

        <button id="tbOrientation" title="Retrato / Paisagem">🗎⇄</button>
        <button
          id="tbImgLeft"
          title="Mover imagem/tabela 1 caractere para a esquerda"
        >
          ←
        </button>
        <button
          id="tbImgRight"
          title="Mover imagem/tabela 1 caractere para a direita"
        >
          →
        </button>
        <button
          id="tbImgUp"
          title="Mover imagem/tabela para o 1º char do parágrafo acima"
        >
          ↑
        </button>
        <button
          id="tbImgDown"
          title="Mover imagem/tabela para o 1º char do parágrafo abaixo"
        >
          ↓
        </button>

        <!-- ✅ IMAGEM -->
        <span style="opacity: 0.7; margin-left: 6px">Imagem:</span>
        <button id="tbImgIns" title="Inserir imagem (no cursor)">🖼️+</button>
        <button id="tbImgSm" title="Diminuir largura">－</button>
        <button id="tbImgLg" title="Aumentar largura">＋</button>

        <input id="tbImgFile" type="file" accept="image/*" hidden />
      </div>
      <div class="toolbar">
        <span>Tabela:</span>
        <button id="tbTblNew" title="Inserir tabela">▦+</button>
        <select id="tbRowKind" title="Tipo da linha selecionada">
          <option value="">Tipo da linha</option>
          <option value="titles">Títulos de coluna</option>
          <option value="detail">Detalhe</option>
          <option value="group">Grupo</option>
          <option value="total">Total de grupo</option>
        </select>

        <button id="tbBdNone" title="Tabela/Linha: sem borda">▢×</button>
        <button id="tbBdThin" title="Tabela/Linha: borda fina">▢─</button>
        <button id="tbBdThick" title="Tabela/Linha: borda grossa">▢━</button>
      </div>
    </div>

    <div class="wrap">
      <div id="stage" class="stage"></div>
    </div>

    <script>
      class RelexEditor {
        constructor({
          stage,
          modePill,
          modeText,
          maxHeaderFooterParagraphs = 10,
        }) {
          this.stage = stage;
          this.modePill = modePill;
          this.modeText = modeText;

          this.MAX_P_HF = maxHeaderFooterParagraphs;

          this.active = null;
          this.insertMode = true;

          this.savedRange = null;

          // imagem
          this.activeImg = null;

          // tabela
          this.activeTbl = null; // span wrapper
          this.activeTblRow = null; // <tr> selecionado
          this.activeTblCell = null; // <td> selecionado

          // bind
          this._onGlobalKeyDown = this._onGlobalKeyDown.bind(this);
          this._onStageMouseDown = this._onStageMouseDown.bind(this);
          this._onSelectionChange = this._onSelectionChange.bind(this);
        }

        init() {
          this.stage.appendChild(this._createPage());
          this._wireTopbar();
          this._wireStageDelegation();
          this._wireToolbar();

          // seed
          const first = this.stage.querySelector(".page");
          first.querySelector(".header-ed").innerHTML = "<p>Empresa XYZ</p>";
          first.querySelector(".footer-ed").innerHTML = "<p>Rodapé</p>";
          first.querySelector(".body-ed").innerHTML =
            "<p>JOAO DA ROCHA LABREGO</p><p>PARÁGRAFO SEGUINTE</p><p>MAIS UM PARÁGRAFO</p>";

          // auto-start no BODY
          queueMicrotask(() => {
            const b = first.querySelector(".body-ed");
            this.insertMode = true;
            this._updateModeUI();
            this.startEdit(b);
            this._normalizeParagraphs(b);
            this._placeCaretEnd(b.querySelector("p:last-child"));
          });
        }

        /* -------------------- UI / estado -------------------- */
        _updateModeUI() {
          this.modeText.textContent = this.insertMode ? "INS" : "OVR";
          this.modePill.classList.toggle("ovr", !this.insertMode);
          if (this.active)
            this.active.classList.toggle("ovr-caret", !this.insertMode);
        }

        _getPageFrom(el) {
          return el?.closest?.(".page") || null;
        }
        _setHfModeForPage(pg, on) {
          if (pg) pg.classList.toggle("hf", !!on);
        }
        _isHeaderOrFooter(ed) {
          return (
            ed.classList.contains("header-ed") ||
            ed.classList.contains("footer-ed")
          );
        }
        _countParagraphs(ed) {
          return ed.querySelectorAll(":scope > p").length;
        }

        /* -------------------- seleção / caret -------------------- */
        _getSelectionRange() {
          const sel = window.getSelection();
          if (!sel || !sel.rangeCount) return null;
          return sel.getRangeAt(0);
        }

        _getActiveParagraph() {
          const r = this._getSelectionRange();
          if (!r) return null;
          const node =
            r.startContainer.nodeType === 3
              ? r.startContainer.parentNode
              : r.startContainer;
          return node.closest?.("p") || null;
        }

        _placeCaretEnd(node) {
          const r = document.createRange();
          r.selectNodeContents(node);
          r.collapse(false);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        }

        _placeCaretStart(node) {
          const r = document.createRange();
          r.selectNodeContents(node);
          r.collapse(true);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        }

        _ensureHasParagraph(ed) {
          if (ed.querySelector(":scope > p")) return;
          const p = document.createElement("p");
          p.appendChild(document.createElement("br"));
          ed.appendChild(p);
          this._placeCaretStart(p);
        }

        _isEmptyP(p) {
          const txt = (p.textContent || "").replace(/\u00A0/g, " ").trim();
          if (txt !== "") return false;
          const els = [...p.childNodes].filter((n) => n.nodeType === 1);
          return (
            els.length === 0 || (els.length === 1 && els[0].tagName === "BR")
          );
        }

        _isCaretAtEndOfParagraph(p, range) {
          if (!range || !range.collapsed) return false;
          const post = document.createRange();
          post.selectNodeContents(p);
          post.setStart(range.startContainer, range.startOffset);
          return post.toString() === "";
        }
        _isCaretAtStartOfParagraph(p, range) {
          if (!range || !range.collapsed) return false;
          const pre = document.createRange();
          pre.selectNodeContents(p);
          pre.setEnd(range.startContainer, range.startOffset);
          return pre.toString() === "";
        }

        /* -------------------- normalização -------------------- */
        _normalizeParagraphs(ed) {
          const nodes = [...ed.childNodes];

          // 1) nós soltos / div -> p
          for (const n of nodes) {
            if (n.nodeType === 3) {
              const txt = n.textContent;
              n.remove();
              const p = document.createElement("p");
              p.textContent = txt;
              ed.appendChild(p);
            } else if (n.nodeType === 1) {
              const tag = n.tagName;
              if (tag === "DIV") {
                const p = document.createElement("p");
                p.innerHTML = n.innerHTML;
                n.replaceWith(p);
              } else if (tag !== "P") {
                const p = document.createElement("p");
                p.appendChild(n);
                ed.appendChild(p);
              }
            }
          }

          // 2) p vazio -> br
          ed.querySelectorAll(":scope > p").forEach((p) => {
            const txt = (p.textContent || "").replace(/\u00A0/g, " ").trim();
            if (txt === "" && p.querySelectorAll("br").length === 0) {
              p.innerHTML = "";
              p.appendChild(document.createElement("br"));
            }
          });

          // 3) garante 1 p
          this._ensureHasParagraph(ed);
        }

        /* -------------------- páginas -------------------- */
        _createPage() {
          const p = document.createElement("div");
          p.className = "page";
          p.innerHTML = `
            <div class="page-inner">
              <div class="band header">
                <div class="band-label">Cabeçalho</div>
                <div class="editable header-ed"></div>
              </div>

              <div class="band body">
                <div class="editable body-ed"></div>
              </div>

              <div class="band footer">
                <div class="band-label">Rodapé</div>
                <div class="editable footer-ed"></div>
              </div>
            </div>`;

          p.querySelectorAll(".editable").forEach((ed) =>
            this._wireEditable(ed),
          );
          return p;
        }

        _createNextPage() {
          const p = this._createPage();
          const first = this.stage.querySelector(".page");
          p.querySelector(".header-ed").innerHTML =
            first.querySelector(".header-ed").innerHTML;
          p.querySelector(".footer-ed").innerHTML =
            first.querySelector(".footer-ed").innerHTML;
          this.stage.appendChild(p);
          return p;
        }

        /* -------------------- edição -------------------- */
        startEdit(ed) {
          if (this.active === ed) return;

          this.stopEdit();

          this.active = ed;
          ed.spellcheck = false;
          ed.contentEditable = "true";
          ed.classList.add("editing");
          ed.classList.toggle("ovr-caret", !this.insertMode);
          ed.focus({ preventScroll: true });

          this._normalizeParagraphs(ed);

          const pg = this._getPageFrom(ed);
          this._setHfModeForPage(pg, this._isHeaderOrFooter(ed));
        }

        stopEdit() {
          if (!this.active) return;
          const pg = this._getPageFrom(this.active);

          this.active.contentEditable = "false";
          this.active.classList.remove("editing", "ovr-caret");
          this.active = null;

          this._setHfModeForPage(pg, false);
        }

        /* -------------------- eventos: topbar / globais -------------------- */
        _wireTopbar() {
          this._updateModeUI();

          document.addEventListener("keydown", this._onGlobalKeyDown);
          document.addEventListener("selectionchange", this._onSelectionChange);
        }

        _onGlobalKeyDown(e) {
          if (!this.active) return;

          if (e.key === "Insert") {
            e.preventDefault();
            this.insertMode = !this.insertMode;
            this._updateModeUI();
          }
        }

        /* -------------------- eventos: mouse -------------------- */
        _wireStageDelegation() {
          this.stage.addEventListener(
            "mousedown",
            this._onStageMouseDown,
            true,
          );
        }

        _onStageMouseDown(e) {
          if (e.target.closest(".topbar")) return;
          if (!e.target.closest(".rx-tbl-wrap")) this._clearActiveTable();
          if (e.button !== 0) return;

          const ed = e.target.closest(".editable");
          if (ed) {
            if (ed !== this.active) this.startEdit(ed);
            return;
          }

          const band = e.target.closest(".band");
          if (!band) return;

          e.preventDefault();

          const targetEd = band.querySelector(".editable");
          if (!targetEd) return;

          this.startEdit(targetEd);
          this._ensureHasParagraph(targetEd);

          if (targetEd.classList.contains("footer-ed")) {
            this._placeCaretStart(targetEd.querySelector("p:first-child"));
          } else {
            this._placeCaretEnd(targetEd.querySelector("p:last-child"));
          }
        }

        _clearActiveTable() {
          if (this.activeTblCell)
            this.activeTblCell.classList.remove("sel-cell");
          if (this.activeTblRow) this.activeTblRow.classList.remove("sel-row");
          if (this.activeTbl) this.activeTbl.classList.remove("sel-table");

          this.activeTbl = null;
          this.activeTblRow = null;
          this.activeTblCell = null;

          const sel = document.getElementById("tbRowKind");
          if (sel) sel.value = "";
        }

        /* -------------------- editable: teclado / input -------------------- */
        // ✅ helper novo
        _toggleTblRow(tblWrap, tr) {
          // se mudou de tabela, limpa tudo
          if (this.activeTbl && this.activeTbl !== tblWrap)
            this._clearActiveTable();

          const isSame = this.activeTbl === tblWrap && this.activeTblRow === tr;

          if (isSame) {
            // ✅ desmarca linha, mas mantém tabela selecionada
            if (this.activeTblRow)
              this.activeTblRow.classList.remove("sel-row");
            this.activeTblRow = null;

            if (!this.activeTbl) this._setActiveTable(tblWrap);
            const sel = document.getElementById("tbRowKind");
            if (sel) sel.value = "";
            return;
          }

          this._setActiveTblRow(tblWrap, tr);
        }

        _wireEditable(ed) {
          ed.addEventListener(
            "mousedown",
            (e) => {
              // 1) TABELA
              const tbl = e.target.closest?.(".rx-tbl-wrap");
              if (tbl) {
                const tr = e.target.closest("tr");
                const td = e.target.closest("td");

                // ✅ CTRL: nunca seleciona célula
                if (e.ctrlKey) {
                  e.preventDefault();
                  e.stopPropagation();

                  // ctrl+clique em célula/linha => alterna linha
                  if (tr) {
                    this._toggleTblRow(tbl, tr);
                    return;
                  }

                  // ctrl+clique fora de tr (ex: borda do wrap) => só tabela
                  this._setActiveTable(tbl);
                  return;
                }

                // ✅ clique normal: seleciona célula
                if (td) {
                  this._setActiveTblCell(tbl, td);
                  return;
                }

                // clique normal no wrap mas não em td => só tabela
                this._setActiveTable(tbl);
                return;
              }

              // 2) IMAGEM
              const img = e.target.closest?.("img.rx-img");
              if (img) {
                this._setActiveImg(img);
                return;
              }

              // 3) clique fora
              this._clearActiveImg();
              this._clearActiveTable();
            },
            true,
          );

          ed.addEventListener("beforeinput", (e) => {
            if (ed !== this.active) return;
            if (e.isComposing) return;

            if (this._isHeaderOrFooter(ed)) {
              const isEnter =
                e.inputType === "insertParagraph" ||
                e.inputType === "insertLineBreak";
              if (isEnter && this._countParagraphs(ed) >= this.MAX_P_HF) {
                e.preventDefault();
                return;
              }
            }

            if (
              !this.insertMode &&
              e.inputType === "insertText" &&
              typeof e.data === "string" &&
              e.data.length === 1
            ) {
              const r = this._getSelectionRange();
              if (!r || !r.collapsed) return;
              const sc = r.startContainer;
              const so = r.startOffset;
              if (sc && sc.nodeType === 3 && so < sc.data.length)
                sc.deleteData(so, 1);
            }
          });

          ed.addEventListener("input", () => {
            if (ed !== this.active) return;
            this._normalizeParagraphs(ed);
            requestAnimationFrame(() => this.paginate());
          });

          ed.addEventListener("keydown", (e) => {
            if (ed !== this.active) return;

            // troca HF via setas
            if (e.key === "ArrowDown" && ed.classList.contains("header-ed")) {
              const pg = this._getPageFrom(ed);
              const p = this._getActiveParagraph();
              if (pg && p && !p.nextElementSibling) {
                e.preventDefault();
                const fed = pg.querySelector(".footer-ed");
                this.startEdit(fed);
                this._normalizeParagraphs(fed);
                this._placeCaretStart(fed.querySelector("p:first-child"));
              }
              return;
            }

            if (e.key === "ArrowUp" && ed.classList.contains("footer-ed")) {
              const pg = this._getPageFrom(ed);
              const p = this._getActiveParagraph();
              if (pg && p && !p.previousElementSibling) {
                e.preventDefault();
                const hed = pg.querySelector(".header-ed");
                this.startEdit(hed);
                this._normalizeParagraphs(hed);
                this._placeCaretEnd(hed.querySelector("p:last-child"));
              }
              return;
            }

            // Cross-page DEL no BODY
            if (e.key === "Delete" && ed.classList.contains("body-ed")) {
              const r = this._getSelectionRange();
              const p = this._getActiveParagraph();
              if (
                r &&
                p &&
                this._isCaretAtEndOfParagraph(p, r) &&
                !p.nextElementSibling
              ) {
                const pages = [...this.stage.querySelectorAll(".page")];
                const pg = this._getPageFrom(ed);
                const i = pages.indexOf(pg);
                const nextPg = i >= 0 ? pages[i + 1] : null;
                if (nextPg) {
                  const nextBody = nextPg.querySelector(".body-ed");
                  const firstNextP = nextBody?.querySelector(
                    ":scope > p:first-child",
                  );
                  if (firstNextP) {
                    e.preventDefault();
                    ed.appendChild(firstNextP);
                    this._ensureHasParagraph(nextBody);
                    this._placeCaretEnd(p);
                    requestAnimationFrame(() => this.paginate());
                  }
                }
              }
              return;
            }

            // Cross-page BACKSPACE no BODY
            if (e.key === "Backspace" && ed.classList.contains("body-ed")) {
              const r = this._getSelectionRange();
              const p = this._getActiveParagraph();
              if (
                r &&
                p &&
                this._isCaretAtStartOfParagraph(p, r) &&
                !p.previousElementSibling
              ) {
                const pages = [...this.stage.querySelectorAll(".page")];
                const pg = this._getPageFrom(ed);
                const i = pages.indexOf(pg);
                const prevPg = i > 0 ? pages[i - 1] : null;
                if (prevPg) {
                  const prevBody = prevPg.querySelector(".body-ed");
                  const lastPrevP = prevBody?.querySelector(
                    ":scope > p:last-child",
                  );
                  if (prevBody && lastPrevP) {
                    e.preventDefault();
                    prevBody.appendChild(p);
                    this._ensureHasParagraph(ed);
                    this._placeCaretEnd(p);
                    requestAnimationFrame(() => this.paginate());
                  }
                }
              }
              return;
            }
          });
        }

        /* -------------------- paginação -------------------- */
        paginate() {
          const pages = [...this.stage.querySelectorAll(".page")];

          const ensureNextPage = (i) => {
            if (pages[i + 1]) return pages[i + 1];
            const created = this._createNextPage();
            pages.push(created);
            return created;
          };

          pages.forEach((pg, i) => {
            const bodyEd = pg.querySelector(".body-ed");
            const bodyBox = pg.querySelector(".body");
            if (!bodyEd || !bodyBox) return;

            while (bodyEd.scrollHeight > bodyBox.clientHeight + 1) {
              const lastP = bodyEd.querySelector(":scope > p:last-child");
              if (!lastP) break;

              const next = ensureNextPage(i);
              const nb = next.querySelector(".body-ed");
              if (!nb) break;

              nb.insertBefore(lastP, nb.firstChild);
            }
          });

          this._pruneEmptyTailPages();
        }

        _isBodyEffectivelyEmpty(bodyEd) {
          const ps = [...bodyEd.querySelectorAll(":scope > p")];
          return ps.length === 1 && this._isEmptyP(ps[0]);
        }

        _pruneEmptyTailPages() {
          let pages = [...this.stage.querySelectorAll(".page")];

          for (let i = pages.length - 1; i > 0; i--) {
            const pg = pages[i];
            const body = pg.querySelector(".body-ed");
            if (!body) break;

            if (this._isBodyEffectivelyEmpty(body)) {
              if (this.active && pg.contains(this.active)) {
                const prev = pages[i - 1];
                const prevBody = prev.querySelector(".body-ed");
                this.startEdit(prevBody);
                this._normalizeParagraphs(prevBody);
                this._placeCaretEnd(prevBody.querySelector("p:last-child"));
              }
              pg.remove();
            } else {
              break;
            }

            pages = [...this.stage.querySelectorAll(".page")];
          }
        }

        /* -------------------- toolbar (formatação + imagem) -------------------- */
        _wireToolbar() {
          const $ = (id) => document.getElementById(id);

          const applyCmd = (cmd, value = null) => {
            if (!this.active) return;

            if (!this._restoreSelection() && !this._selectionInsideActive())
              return;

            const host = this._getCommandHost();
            if (!host) return;

            host.focus({ preventScroll: true }); // ✅ foco no TD quando for célula
            document.execCommand(cmd, false, value);

            this._saveSelection();
          };

          $("tbBold").onclick = () => applyCmd("bold");
          $("tbItalic").onclick = () => applyCmd("italic");
          $("tbUnder").onclick = () => applyCmd("underline");
          $("tbClear").onclick = () => applyCmd("removeFormat");

          $("tbLeft").onclick = () => applyCmd("justifyLeft");
          $("tbCenter").onclick = () => applyCmd("justifyCenter");
          $("tbRight").onclick = () => applyCmd("justifyRight");
          $("tbJust").onclick = () => applyCmd("justifyFull");

          $("tbFont").onchange = (e) => {
            const v = e.target.value;
            if (!v) return;
            applyCmd("fontName", v);
            e.target.value = "";
          };

          $("tbSize").onchange = (e) => {
            const v = e.target.value;
            if (!v) return;
            applyCmd("fontSize", v);
            e.target.value = "";
          };

          $("tbColor").oninput = (e) => {
            const v = e.target.value;
            applyCmd("foreColor", v);
          };

          // ===== imagem =====
          const tbImgFile = $("tbImgFile");

          $("tbImgIns").onclick = () => {
            if (!this.active) return;
            // garante ter um range salvo (se não tiver, usa o atual)
            if (!this.savedRange) this._saveSelection();
            tbImgFile.value = "";
            tbImgFile.click();
          };

          tbImgFile.addEventListener("change", async () => {
            if (!this.active) return;
            if (!this.savedRange) this._saveSelection();
            if (!this._restoreSelection() && !this._selectionInsideActive())
              return;

            const file = tbImgFile.files && tbImgFile.files[0];
            if (!file) return;

            const dataUrl = await new Promise((resolve, reject) => {
              const fr = new FileReader();
              fr.onload = () => resolve(fr.result);
              fr.onerror = reject;
              fr.readAsDataURL(file);
            });

            this.active.focus({ preventScroll: true });

            const img = document.createElement("img");
            img.className = "rx-img";
            img.src = dataUrl;
            img.alt = file.name || "imagem";
            img.style.setProperty("--iw", "80px");

            // insere NO <p> atual, na posição do cursor
            this._insertImageInCurrentParagraphAtCaret(img);

            this._setActiveImg(img);
            this._saveSelection();
            requestAnimationFrame(() => this.paginate());
          });

          $("tbImgLeft").onclick = () => this._moveImgChar(-1);
          $("tbImgRight").onclick = () => this._moveImgChar(1);
          $("tbImgUp").onclick = () => this._moveImgToParagraph(-1);
          $("tbImgDown").onclick = () => this._moveImgToParagraph(1);

          $("tbImgSm").onclick = () => this._resizeImg(-10);
          $("tbImgLg").onclick = () => this._resizeImg(10);

          // ===== tabela: mover como imagem =====
          $("tbImgLeft").onclick = () => {
            if (this.activeTbl) this._moveTblChar(-1);
            else this._moveImgChar(-1);
          };

          $("tbImgRight").onclick = () => {
            if (this.activeTbl) this._moveTblChar(1);
            else this._moveImgChar(1);
          };

          $("tbImgUp").onclick = () => {
            if (this.activeTbl) this._moveTblToParagraph(-1);
            else this._moveImgToParagraph(-1);
          };

          $("tbImgDown").onclick = () => {
            if (this.activeTbl) this._moveTblToParagraph(1);
            else this._moveImgToParagraph(1);
          };

          // ===== tabela =====
          const MAX_TABLE_RC = 20;

          $("tbTblNew").onclick = () => {
            if (!this.active) return;

            const r1 = prompt(`Número de linhas (1..${MAX_TABLE_RC})`, "3");
            if (r1 == null) return;
            const rows = parseInt(r1, 10);

            const r2 = prompt(`Número de colunas (1..${MAX_TABLE_RC})`, "3");
            if (r2 == null) return;
            const cols = parseInt(r2, 10);

            if (!Number.isFinite(rows) || !Number.isFinite(cols)) return;
            if (rows < 1 || cols < 1) return;
            if (rows > MAX_TABLE_RC || cols > MAX_TABLE_RC) return;

            if (!this.savedRange) this._saveSelection();
            if (!this._restoreSelection() && !this._selectionInsideActive())
              return;

            this.active.focus({ preventScroll: true });
            this._insertTableAtCaret(rows, cols);
            requestAnimationFrame(() => this.paginate());
          };

          $("tbRowKind").onchange = (e) => {
            const kind = e.target.value || "";
            if (!this.activeTblRow) return;
            this._setRowKind(this.activeTblRow, kind);
          };

          let portrait = true;

          $("tbOrientation").onclick = () => {
            portrait = !portrait;

            const root = document.documentElement.style;

            if (portrait) {
              root.setProperty("--page-w", "210mm");
              root.setProperty("--page-h", "297mm");
            } else {
              root.setProperty("--page-w", "297mm");
              root.setProperty("--page-h", "210mm");
            }

            requestAnimationFrame(() => this.paginate());
          };

          const borderColor = () =>
            document.getElementById("tbColor")?.value || "#000";

          $("tbBdNone").onclick = () => this._tblApplyGridBorder("none");
          $("tbBdThin").onclick = () =>
            this._tblApplyGridBorder(`1px solid ${borderColor()}`);
          $("tbBdThick").onclick = () =>
            this._tblApplyGridBorder(`2px solid ${borderColor()}`);
        }

        _selectionInsideActive() {
          if (!this.active) return false;
          const sel = window.getSelection();
          if (!sel || sel.rangeCount === 0) return false;
          const r = sel.getRangeAt(0);
          const a =
            r.commonAncestorContainer.nodeType === 3
              ? r.commonAncestorContainer.parentNode
              : r.commonAncestorContainer;
          return this.active.contains(a);
        }

        _onSelectionChange() {
          if (!this.active) return;
          if (!this._selectionInsideActive()) return;
          this._saveSelection();
        }

        _saveSelection() {
          const sel = window.getSelection();
          if (sel && sel.rangeCount)
            this.savedRange = sel.getRangeAt(0).cloneRange();
        }

        _restoreSelection() {
          if (!this.savedRange) return false;
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(this.savedRange);
          return true;
        }

        /* ==========================
           IMAGEM: lógica “dentro do <p>”
        ========================== */

        _setActiveImg(img) {
          if (this.activeImg && this.activeImg !== img)
            this.activeImg.classList.remove("sel");
          this.activeImg = img || null;
          if (this.activeImg) this.activeImg.classList.add("sel");
        }
        _clearActiveImg() {
          if (this.activeImg) this.activeImg.classList.remove("sel");
          this.activeImg = null;
        }

        _getTargetImg() {
          if (
            this.activeImg &&
            this.active &&
            this.active.contains(this.activeImg)
          )
            return this.activeImg;

          const r = this.savedRange || this._getSelectionRange();
          if (!r || !this.active) return null;
          const node =
            r.commonAncestorContainer.nodeType === 3
              ? r.commonAncestorContainer.parentNode
              : r.commonAncestorContainer;
          return node.closest?.("img.rx-img") || null;
        }

        _insertImageInCurrentParagraphAtCaret(img) {
          // garante que o caret esteja dentro de um <p>
          const r = this._getSelectionRange();
          const p = this._getActiveParagraph();
          if (!r || !p) return;

          // colapsa no início da seleção
          if (!r.collapsed) r.collapse(true);

          // insere IMG exatamente no range
          r.insertNode(img);

          // spacer (pra caret não ficar “colado” e permitir digitação)
          const spacer = document.createTextNode("\u00A0");
          img.after(spacer);

          // caret depois do spacer
          const nr = document.createRange();
          nr.setStartAfter(spacer);
          nr.collapse(true);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(nr);
          this._saveSelection();
        }

        _getTextOffsetBeforeNode(container, node) {
          const r = document.createRange();
          r.selectNodeContents(container);
          r.setEndBefore(node);
          return r.toString().length;
        }

        _getTextLength(container) {
          const r = document.createRange();
          r.selectNodeContents(container);
          return r.toString().length;
        }

        _insertNodeAtTextOffset(container, node, offset) {
          const total = this._getTextLength(container);
          if (offset < 0) offset = 0;
          if (offset > total) offset = total;

          const tw = document.createTreeWalker(
            container,
            NodeFilter.SHOW_TEXT,
            null,
          );
          let cur;
          let remaining = offset;

          while ((cur = tw.nextNode())) {
            const len = cur.nodeValue.length;

            if (remaining <= len) {
              if (remaining === 0) {
                cur.parentNode.insertBefore(node, cur);
              } else if (remaining === len) {
                cur.parentNode.insertBefore(node, cur.nextSibling);
              } else {
                const right = cur.splitText(remaining);
                right.parentNode.insertBefore(node, right);
              }
              return;
            }
            remaining -= len;
          }
          container.appendChild(node);
        }

        _cleanupEmptyTextNodes(p) {
          // remove text nodes vazios / só NBSP
          const toRemove = [];
          for (const n of p.childNodes) {
            if (n.nodeType !== 3) continue;
            const t = (n.nodeValue || "").replace(/\u00A0/g, "");
            if (t === "") toRemove.push(n);
          }
          toRemove.forEach((n) => n.remove());
          // garante um <br> se ficou vazio
          if (
            !p.textContent.trim() &&
            p.querySelectorAll("img.rx-img").length === 0
          ) {
            p.innerHTML = "";
            p.appendChild(document.createElement("br"));
          }
        }

        _moveImgChar(dir) {
          if (!this.active) return;
          if (!this.savedRange) this._saveSelection();
          this.active.focus({ preventScroll: true });

          const img = this._getTargetImg();
          if (!img) return;

          const p = img.closest("p");
          if (!p) return;

          const pos = this._getTextOffsetBeforeNode(p, img);
          const total = this._getTextLength(p);

          img.remove();
          this._cleanupEmptyTextNodes(p);

          let nextPos = pos + dir;
          if (nextPos < 0) nextPos = 0;
          if (nextPos > total) nextPos = total;

          this._insertNodeAtTextOffset(p, img, nextPos);

          // caret depois da imagem
          const r = document.createRange();
          r.setStartAfter(img);
          r.collapse(true);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
          this._saveSelection();

          this._setActiveImg(img);
          requestAnimationFrame(() => this.paginate());
        }

        _moveImgToParagraph(dir) {
          if (!this.active) return;
          if (!this.savedRange) this._saveSelection();
          this.active.focus({ preventScroll: true });

          const img = this._getTargetImg();
          if (!img) return;

          const p = img.closest("p");
          if (!p) return;

          // ⚠️ regra: isso é navegação de parágrafos do BODY
          const bodyEd = p.closest(".body-ed");
          const pg = this._getPageFrom(bodyEd || p);

          // alvo "normal": parágrafo anterior/próximo na mesma página
          let target =
            dir > 0 ? p.nextElementSibling : p.previousElementSibling;

          // se existe, mas não é <p>, aborta (segurança)
          if (target && target.tagName !== "P") return;

          // ===== cross-page =====
          if (!target && bodyEd && pg) {
            const pages = [...this.stage.querySelectorAll(".page")];
            const i = pages.indexOf(pg);

            const firstP = bodyEd.querySelector(":scope > p:first-child");
            const lastP = bodyEd.querySelector(":scope > p:last-child");

            if (dir > 0 && p === lastP) {
              // ↓ no último parágrafo: vai para o primeiro parágrafo da PRÓXIMA página
              let nextPg = pages[i + 1];
              if (!nextPg) {
                nextPg = this._createNextPage();
                pages.push(nextPg);
              }

              const nextBody = nextPg.querySelector(".body-ed");
              this._ensureHasParagraph(nextBody);
              target = nextBody.querySelector(":scope > p:first-child");
            }

            if (dir < 0 && p === firstP) {
              // ↑ no primeiro parágrafo: vai para o último parágrafo da PÁGINA ANTERIOR
              if (i <= 0) return; // exceção: primeira página -> para

              const prevPg = pages[i - 1];
              const prevBody = prevPg.querySelector(".body-ed");
              this._ensureHasParagraph(prevBody);
              target = prevBody.querySelector(":scope > p:last-child");
            }
          }

          // se ainda não achou alvo, não faz nada
          if (!target || target.tagName !== "P") return;

          img.remove();
          this._cleanupEmptyTextNodes(p);

          // início do parágrafo alvo (offset 0)
          const at = dir > 0 ? 0 : this._getTextLength(target);
          this._insertNodeAtTextOffset(target, img, at);
          // ✅ garante que o editor destino vire o "active"
          const targetEd = target.closest(".editable");
          if (targetEd && targetEd !== this.active) {
            this.startEdit(targetEd);
          }

          // opcional: rolar até o parágrafo destino
          target.scrollIntoView({ block: "nearest" });

          // caret depois da imagem
          const r = document.createRange();
          r.setStartAfter(img);
          r.collapse(true);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
          this._saveSelection();

          this._setActiveImg(img);
          requestAnimationFrame(() => this.paginate());
        }

        _resizeImg(deltaPx) {
          if (!this.active) return;
          if (!this.savedRange) this._saveSelection();
          this.active.focus({ preventScroll: true });

          const img = this._getTargetImg();
          if (!img) return;

          const cur = (img.style.getPropertyValue("--iw") || "").trim();
          let w = 80;

          if (cur.endsWith("px")) w = parseFloat(cur);
          else w = Math.round(img.getBoundingClientRect().width);

          w = Math.max(20, w + deltaPx);
          img.style.setProperty("--iw", `${w}px`);

          this._setActiveImg(img);
          this._saveSelection();
          requestAnimationFrame(() => this.paginate());
        }

        _setActiveTblRow(tblWrap, tr) {
          // limpa anterior
          if (this.activeTblRow) this.activeTblRow.classList.remove("sel-row");
          if (this.activeTbl && this.activeTbl !== tblWrap)
            this.activeTbl.classList.remove("sel-table");

          this.activeTbl = tblWrap;
          this.activeTblRow = tr;

          tblWrap.classList.add("sel-table");
          tr.classList.add("sel-row");

          const sel = document.getElementById("tbRowKind");
          if (sel) sel.value = tr.dataset.kind || "";
        }

        _createTbl(rows, cols) {
          const wrap = document.createElement("span");
          wrap.className = "rx-tbl-wrap";
          wrap.dataset.cols = String(cols);
          wrap.contentEditable = "false";
          wrap.tabIndex = 0; // permite foco/teclado depois se quiser

          const table = document.createElement("table");
          table.className = "rx-tbl";

          const tb = document.createElement("tbody");

          for (let r = 0; r < rows; r++) {
            const tr = document.createElement("tr");
            tr.dataset.kind = "detail"; // default

            for (let c = 0; c < cols; c++) {
              const td = document.createElement("td");
              td.contentEditable = "true"; // ✅ ESSENCIAL
              td.appendChild(document.createElement("br"));
              tr.appendChild(td);
            }
            tb.appendChild(tr);
          }

          table.appendChild(tb);
          wrap.appendChild(table);
          return wrap;
        }

        _setRowKind(tr, kind) {
          // unicidade
          if (kind === "titles" || kind === "detail") {
            const tbl = tr.closest(".rx-tbl");
            const other = tbl.querySelector(`tr[data-kind="${kind}"]`);
            if (other && other !== tr) other.dataset.kind = ""; // ou "none"
          }
          if (!tr) return;

          tr.dataset.kind = kind || "";

          const wrap = tr.closest(".rx-tbl-wrap");
          const cols = parseInt(wrap?.dataset?.cols || "1", 10);

          // grupo/total => 1 célula com colspan
          if (kind === "group" || kind === "total") {
            const tds = tr.querySelectorAll(":scope > td");
            if (tds.length === 1 && tds[0].colSpan === cols) return; // já está ok

            const td = document.createElement("td");
            td.colSpan = cols;
            td.contentEditable = "true";
            td.appendChild(document.createElement("br"));
            tr.innerHTML = "";
            tr.appendChild(td);
            return;
          }

          // titles/detail => volta a ter colunas
          // (se já tem cols, não mexe)
          const tds = tr.querySelectorAll(":scope > td");
          if (tds.length === cols) return;

          tr.innerHTML = "";
          for (let c = 0; c < cols; c++) {
            const td = document.createElement("td");
            td.contentEditable = "true";
            td.appendChild(document.createElement("br"));
            tr.appendChild(td);
          }
        }

        _insertTableAtCaret(rows, cols) {
          const r = this._getSelectionRange();
          const p = this._getActiveParagraph();
          if (!r || !p) return;

          if (!r.collapsed) r.collapse(true);

          const wrap = this._createTbl(rows, cols);

          r.insertNode(wrap);

          // spacer pra caret e digitação depois da tabela
          const spacer = document.createTextNode("\u00A0");
          wrap.after(spacer);

          const nr = document.createRange();
          nr.setStartAfter(spacer);
          nr.collapse(true);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(nr);
          this._saveSelection();

          // seleciona 1ª linha automaticamente e seta combo
          const firstRow = wrap.querySelector("tr");
          if (firstRow) this._setActiveTblRow(wrap, firstRow);
        }

        _tblApplyGridBorder(cssBorder) {
          // prioridade: célula > linha > tabela
          if (this.activeTblCell) {
            this._applyBorderToCell(this.activeTblCell, cssBorder);
            return;
          }
          if (this.activeTblRow) {
            this._applyBorderToRow(this.activeTblRow, cssBorder);
            return;
          }
          if (this.activeTbl) {
            const tbl = this.activeTbl.querySelector("table.rx-tbl");
            if (tbl) this._applyBorderToTable(tbl, cssBorder);
          }
        }

        _applyBorderToCell(td, cssBorder) {
          td.style.border = cssBorder;
        }

        _applyBorderToRow(tr, cssBorder) {
          tr.querySelectorAll(":scope > td").forEach(
            (td) => (td.style.border = cssBorder),
          );
        }

        _applyBorderToTable(table, cssBorder) {
          table
            .querySelectorAll("td")
            .forEach((td) => (td.style.border = cssBorder));
        }

        _tblApplyFrame(px, color) {
          // prioridade: tabela selecionada (wrap)
          const wrap =
            this.activeTbl || this.activeTblRow?.closest(".rx-tbl-wrap");
          if (!wrap) return;

          // moldura externa sem brigar com border-collapse
          if (px <= 0) {
            wrap.style.boxShadow = "";
          } else {
            wrap.style.boxShadow = `inset 0 0 0 ${px}px ${color}`;
          }
        }
        _setActiveTblCell(tblWrap, td) {
          if (this.activeTblCell)
            this.activeTblCell.classList.remove("sel-cell");
          if (this.activeTblRow) this.activeTblRow.classList.remove("sel-row");
          if (this.activeTbl && this.activeTbl !== tblWrap)
            this.activeTbl.classList.remove("sel-table");

          this.activeTbl = tblWrap;
          this.activeTblCell = td;
          this.activeTblRow = td.closest("tr") || null;

          tblWrap.classList.add("sel-table");
          td.classList.add("sel-cell");

          const sel = document.getElementById("tbRowKind");
          if (sel && this.activeTblRow)
            sel.value = this.activeTblRow.dataset.kind || "";
        }

        _setActiveTable(tblWrap) {
          // limpa tudo visualmente
          if (this.activeTblCell)
            this.activeTblCell.classList.remove("sel-cell");
          if (this.activeTblRow) this.activeTblRow.classList.remove("sel-row");
          if (this.activeTbl && this.activeTbl !== tblWrap)
            this.activeTbl.classList.remove("sel-table");

          this.activeTbl = tblWrap;
          this.activeTblRow = null;
          this.activeTblCell = null;

          tblWrap.classList.add("sel-table");

          const sel = document.getElementById("tbRowKind");
          if (sel) sel.value = "";
        }

        _getTargetTbl() {
          if (
            this.activeTbl &&
            this.active &&
            this.active.contains(this.activeTbl)
          ) {
            return this.activeTbl;
          }

          const r = this.savedRange || this._getSelectionRange();
          if (!r || !this.active) return null;

          const node =
            r.commonAncestorContainer.nodeType === 3
              ? r.commonAncestorContainer.parentNode
              : r.commonAncestorContainer;

          return node.closest?.(".rx-tbl-wrap") || null;
        }

        _moveTblChar(dir) {
          if (!this.active) return;
          if (!this.savedRange) this._saveSelection();
          this.active.focus({ preventScroll: true });

          const tbl = this._getTargetTbl();
          if (!tbl) return;

          const p = tbl.closest("p");
          if (!p) return;

          const pos = this._getTextOffsetBeforeNode(p, tbl);
          const total = this._getTextLength(p);

          tbl.remove();
          this._cleanupEmptyTextNodes(p);

          let nextPos = pos + dir;
          if (nextPos < 0) nextPos = 0;
          if (nextPos > total) nextPos = total;

          this._insertNodeAtTextOffset(p, tbl, nextPos);

          // caret depois da tabela
          const r = document.createRange();
          r.setStartAfter(tbl);
          r.collapse(true);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
          this._saveSelection();

          this._setActiveTable(tbl);
          requestAnimationFrame(() => this.paginate());
        }

        _moveTblToParagraph(dir) {
          if (!this.active) return;
          if (!this.savedRange) this._saveSelection();
          this.active.focus({ preventScroll: true });

          const tbl = this._getTargetTbl();
          if (!tbl) return;

          const p = tbl.closest("p");
          if (!p) return;

          const bodyEd = p.closest(".body-ed");
          const pg = this._getPageFrom(bodyEd || p);

          let target =
            dir > 0 ? p.nextElementSibling : p.previousElementSibling;

          if (target && target.tagName !== "P") return;

          if (!target && bodyEd && pg) {
            const pages = [...this.stage.querySelectorAll(".page")];
            const i = pages.indexOf(pg);

            const firstP = bodyEd.querySelector(":scope > p:first-child");
            const lastP = bodyEd.querySelector(":scope > p:last-child");

            if (dir > 0 && p === lastP) {
              let nextPg = pages[i + 1];
              if (!nextPg) {
                nextPg = this._createNextPage();
                pages.push(nextPg);
              }
              const nextBody = nextPg.querySelector(".body-ed");
              this._ensureHasParagraph(nextBody);
              target = nextBody.querySelector(":scope > p:first-child");
            }

            if (dir < 0 && p === firstP) {
              if (i <= 0) return;
              const prevPg = pages[i - 1];
              const prevBody = prevPg.querySelector(".body-ed");
              this._ensureHasParagraph(prevBody);
              target = prevBody.querySelector(":scope > p:last-child");
            }
          }

          if (!target || target.tagName !== "P") return;

          tbl.remove();
          this._cleanupEmptyTextNodes(p);

          const at = dir > 0 ? 0 : this._getTextLength(target);
          this._insertNodeAtTextOffset(target, tbl, at);

          const targetEd = target.closest(".editable");
          if (targetEd && targetEd !== this.active) {
            this.startEdit(targetEd);
          }

          target.scrollIntoView({ block: "nearest" });

          const r = document.createRange();
          r.setStartAfter(tbl);
          r.collapse(true);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
          this._saveSelection();

          this._setActiveTable(tbl);
          requestAnimationFrame(() => this.paginate());
        }

        _getCommandHost() {
          const r = this.savedRange || this._getSelectionRange();
          if (!r) return this.active;

          const node =
            r.commonAncestorContainer.nodeType === 3
              ? r.commonAncestorContainer.parentNode
              : r.commonAncestorContainer;

          // se a seleção está dentro de uma célula editável, o host é o TD
          const td = node.closest?.(
            "td[contenteditable='true'], td[contenteditable=true]",
          );
          if (td) return td;

          return this.active;
        }
      }

      // boot
      (() => {
        const relex = new RelexEditor({
          stage: document.getElementById("stage"),
          modePill: document.getElementById("modePill"),
          modeText: document.getElementById("modeText"),
          maxHeaderFooterParagraphs: 10,
        });
        relex.init();
      })();
    </script>
  </body>
</html>
