<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Checkbox Quaternário (cor apenas quando marcado)</title>
    <style>
        tri-checkbox {
            display: inline-flex;
            align-items: center;
            font-size: 14px;
            gap: 5px;
            cursor: pointer;
            vertical-align: middle;
            user-select: none;
        }
            tri-checkbox .fakebox:hover,
            tri-checkbox .fakebox:focus {
                outline: none;
                border: 1px solid #555; /* leve escurecimento */
                box-shadow: 0 0 1px 1px #999; /* brilho discreto */
            }


            tri-checkbox .fakebox {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 10px;
                height: 10px;
                border-radius: 3px;
                border: 1px solid black;
                font-family: monospace;
                font-size: 10px;
                line-height: 10px;
                background-color: white; /* sempre branco por padrão */
                vertical-align: middle;
                user-select: none;
                transition: background-color 0.15s ease;
            }

                /* Somente quando marcado (1,2,3,4) o fundo muda */
                tri-checkbox .fakebox[data-state="1"],
                tri-checkbox .fakebox[data-state="2"],
                tri-checkbox .fakebox[data-state="3"],
                tri-checkbox .fakebox[data-state="4"] {
                    background-color: #B7AB9E;
                }

    </style>
</head>
<body>
    <tri-checkbox>Valor por extenso?</tri-checkbox>
    <tri-checkbox>Requerida?</tri-checkbox>

    <script>
        class TriCheckbox extends HTMLElement {
            constructor() {
                super();
                this.state = 0;
                this.symbols = ["", "✔", "–", "Ø", "✗"];
                this.ariaStates = ["false", "true", "ignored", "null", "not null"];
                this.tooltips = ["false", "true", "ignored", "null", "not null"];
            }

            connectedCallback() {
                const labelText = this.textContent.trim();
                this.innerHTML = `
                <span class="fakebox" role="checkbox" aria-checked="false" tabindex="0" data-state="0"></span>
                <span class="label-text">${labelText}</span>
              `;

                this.fakebox = this.querySelector(".fakebox");
                this.fakebox.addEventListener("click", () => this.advanceState());
                this.fakebox.addEventListener("keydown", (e) => {
                    if (e.key === " " || e.key === "Enter") {
                        this.advanceState();
                        e.preventDefault();
                    }
                });

                this.update();
            }

            advanceState() {
                this.state = (this.state + 1) % this.symbols.length;
                this.update();
            }

            update() {
                this.fakebox.textContent = this.symbols[this.state];
                this.fakebox.setAttribute("aria-checked", this.ariaStates[this.state]);
                this.fakebox.setAttribute("title", this.tooltips[this.state]);
                this.fakebox.dataset.state = this.state;
            }
        }

        customElements.define("tri-checkbox", TriCheckbox);
    </script>
</body>
</html>
