<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Checkbox Quaternário (Sem Shadow)</title>
    <style>
      tri-checkbox {
        display: inline-flex;
        align-items: center;
        gap: 1dvmin;
        cursor: pointer;
        vertical-align: middle;
        user-select: none;
        font-family: sans-serif;
      }

      tri-checkbox .fakebox {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.5dvmin;
        height: 1.5dvmin;
        border: 1px solid #333;
        font-family: monospace;
        font-size: 1.5dvmin;
        line-height: 1;
        background-color: white;
        vertical-align: middle;
        user-select: none;
      }

      tri-checkbox .fakebox[data-state="1"],
      tri-checkbox .fakebox[data-state="2"],
      tri-checkbox .fakebox[data-state="3"] {
        background-color: #ddd;
      }

      tri-checkbox .fakebox:hover,
      tri-checkbox .fakebox:focus {
        background-color: #ccc;
        outline: none;
      }
    </style>
  </head>
  <body>
    <tri-checkbox>Valor por extenso?</tri-checkbox>
    <tri-checkbox>Requerida?</tri-checkbox>

    <script>
      class TriCheckbox extends HTMLElement {
        constructor() {
          super();
          this.state = 0;
          this.symbols = ["", "✔", "–", "?"];
          this.ariaStates = ["false", "true", "mixed", "undefined"];
          this.tooltips = ["Desmarcado", "Marcado", "Nulo", "Null (ativo)"];
        }

        connectedCallback() {
          const labelText = this.textContent.trim();
          this.innerHTML = `
        <span class="fakebox" role="checkbox" aria-checked="false" tabindex="0" title="Desmarcado" data-state="0"></span>
        <span class="label-text">${labelText}</span>
      `;

          this.fakebox = this.querySelector(".fakebox");
          this.label = this.querySelector(".label-text");

          this.fakebox.addEventListener("click", () => this.advanceState());
          this.fakebox.addEventListener("keydown", (e) => {
            if (e.key === " " || e.key === "Enter") {
              this.advanceState();
              e.preventDefault();
            }
          });

          this.update();
        }

        advanceState() {
          this.state = (this.state + 1) % 4;
          this.update();
        }

        update() {
          this.fakebox.textContent = this.symbols[this.state];
          this.fakebox.setAttribute(
            "aria-checked",
            this.ariaStates[this.state]
          );
          this.fakebox.setAttribute("title", this.tooltips[this.state]);
          this.fakebox.dataset.state = this.state;
        }
      }

      customElements.define("tri-checkbox", TriCheckbox);
    </script>
  </body>
</html>
