<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dropdown paginado com + e - (IN & BETWEEN)</title>
    <style>
      /* Aparência baseada no seu exemplo (dvmin) */
      .filterable-dropdown-wrapper {
        display: inline-block;
        position: relative;
        font-family: inherit;
      }
      .fd-input {
        width: 100%;
        height: 2.8dvmin;
        padding: 0.5dvmin 0.5dvmin;
        box-sizing: border-box;
        border: 0.1dvmin solid #000;
        border-radius: 0.1dvmin;
      }
      .fd-icon,
      .fd-plus {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 2dvmin;
        color: #888;
        user-select: none;
      }
      .fd-icon {
        right: 0.5dvmin;
      }
      .fd-plus {
        right: 2.6dvmin;
      }
      .fd-list {
        position: absolute;
        top: calc(100% + 0.8dvmin);
        left: 0;
        right: 0;
        max-height: 100dvmin;
        overflow-y: auto;
        background: #fff;
        display: none;
        box-shadow: 0 0.8dvmin 1.6dvmin rgba(0, 0, 0, 0.2);
        z-index: 100;
      }
      .fd-list.open {
        display: block;
      }

      .fd-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6dvmin;
        padding: 0.5dvmin;
        cursor: pointer;
      }
      .fd-item:hover {
        background: #f0f0f0;
      }
      .fd-item.selected {
        background: #007bff;
        color: #fff;
      }
      .fd-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fd-del {
        flex: 0 0 auto;
        border: none;
        background: none;
        color: #c00;
        cursor: pointer;
        font-size: 2dvmin;
        line-height: 1;
        padding: 0 0.4dvmin;
      }
      .fd-del:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .fd-pagination {
        display: flex;
        justify-content: space-between;
        gap: 0.5dvmin;
        padding: 0.5dvmin;
        background: #f9f9f9;
      }
      .fd-pagination button {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 2dvmin;
        color: #007bff;
      }
      .fd-pagination button[disabled] {
        color: #ccc;
        cursor: not-allowed;
        pointer-events: none;
      }

      .demo {
        margin: 1.2dvmin 0;
      }
      .demo h3 {
        margin: 0.2dvmin 0;
        font: 600 2.2dvmin/1.2 system-ui;
      }
      .demo .row {
        display: flex;
        align-items: center;
        gap: 1dvmin;
        flex-wrap: wrap;
      }
      .demo code {
        font-size: 1.8dvmin;
      }
    </style>
  </head>
  <body>
    <div class="demo">
      <h3>Operador IN (lista livre)</h3>
      <div class="row">
        <div id="ddIN"></div>
        <button id="btnIN" type="button">Ler JSON</button>
        <code id="outIN">[]</code>
      </div>
    </div>

    <div class="demo">
      <h3>Operador BETWEEN (máx. 2 itens)</h3>
      <div class="row">
        <div id="ddBETWEEN"></div>
        <button id="btnBT" type="button">Ler JSON</button>
        <code id="outBT">[]</code>
      </div>
    </div>

    <script>
      class PagedAddableDropdown {
        constructor(
          container,
          {
            data = [],
            itemsPerPage = 5,
            placeholder = "Type to add",
            maxItems = Infinity,
            unique = true,
          } = {}
        ) {
          if (!container) throw new Error("Container element is required.");
          /* estado */
          this.container = container;
          this.data = [...data];
          this.filteredData = [...data];
          this.itemsPerPage = itemsPerPage;
          this.currentPage = 0;
          this._closeByBlur = true;
          this.maxItems = maxItems;
          this.unique = unique;

          /* DOM */
          this._buildDom(placeholder);
          this._bindEvents();
          this._renderItems();
        }

        /* UI */
        _buildDom(placeholder) {
          this.container.classList.add("filterable-dropdown-wrapper");

          const inputWrap = document.createElement("div");
          inputWrap.style.position = "relative";
          this.container.append(inputWrap);

          this.input = document.createElement("input");
          this.input.type = "text";
          this.input.placeholder = placeholder;
          this.input.className = "fd-input";
          inputWrap.append(this.input);

          this.plus = document.createElement("span");
          this.plus.className = "fd-plus";
          this.plus.title = "Adicionar (+)";
          this.plus.textContent = "+";
          inputWrap.append(this.plus);

          this.icon = document.createElement("span");
          this.icon.className = "fd-icon";
          this.icon.textContent = "▼";
          inputWrap.append(this.icon);

          this.list = document.createElement("div");
          this.list.className = "fd-list";
          inputWrap.append(this.list);

          this.itemsBox = document.createElement("div");
          this.list.append(this.itemsBox);

          const pagination = document.createElement("div");
          pagination.className = "fd-pagination";
          this.list.append(pagination);
          this.prevBtn = document.createElement("button");
          this.prevBtn.textContent = "◄";
          this.prevBtn.disabled = true;
          pagination.append(this.prevBtn);
          this.nextBtn = document.createElement("button");
          this.nextBtn.textContent = "►";
          pagination.append(this.nextBtn);
        }

        _bindEvents() {
          /* abrir/fechar */
          this.icon.addEventListener("mousedown", (e) => {
            e.preventDefault();
            this.input.focus();
            this._toggleList();
          });
          this.input.addEventListener("click", (e) => {
            e.stopPropagation();
            if (this._closeByBlur) {
              this._toggleList();
            }
            this._closeByBlur = true;
          });
          this.input.addEventListener("focus", () => {
            if (this.input.value.trim()) {
              this._filterItems(this.input.value.trim());
              this._showList();
              this._closeByBlur = false;
            }
          });
          this.input.addEventListener("blur", () => {
            if (this._closeByBlur) this._hideList();
            this._closeByBlur = true;
          });

          /* filtrar */
          this.input.addEventListener("input", (e) => {
            this._filterItems(e.target.value.trim());
            this._showList();
          });

          /* adicionar (+) */
          this.plus.addEventListener("mousedown", (e) => {
            e.preventDefault();
            this.addFromInput();
          });
          this.input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              this.addFromInput();
            }
          });

          /* paginação */
          this.prevBtn.addEventListener("click", () => this._changePage(-1));
          this.nextBtn.addEventListener("click", () => this._changePage(1));

          /* clique fora */
          document.addEventListener(
            "mousedown",
            (this._handleOutside = (e) => {
              if (!this.container.contains(e.target)) this._hideList();
            })
          );

          /* coordenar outros dropdowns */
          window.addEventListener(
            "dropdownOpened",
            (this._handleGlobal = (e) => {
              if (e.detail.dropdown !== this) this._hideList();
            })
          );

          /* impedir blur na lista */
          this.list.addEventListener("mousedown", (e) => e.preventDefault());
        }

        /* lógica */
        _filterItems(q) {
          this.filteredData = this.data.filter((i) =>
            i.toLowerCase().includes(q.toLowerCase())
          );
          this.currentPage = 0;
          this._renderItems();
        }

        _changePage(delta) {
          const pages = Math.max(
            1,
            Math.ceil(this.filteredData.length / this.itemsPerPage)
          );
          this.currentPage = Math.min(
            Math.max(this.currentPage + delta, 0),
            pages - 1
          );
          this._renderItems();
        }

        _renderItems() {
          const start = this.currentPage * this.itemsPerPage;
          const end = start + this.itemsPerPage;
          this.itemsBox.replaceChildren();

          this.filteredData.slice(start, end).forEach((item) => {
            const row = document.createElement("div");
            row.className = "fd-item";

            const label = document.createElement("div");
            label.className = "fd-label";
            label.textContent = item;
            row.append(label);

            const del = document.createElement("button");
            del.className = "fd-del";
            del.type = "button";
            del.title = "Remover";
            del.textContent = "−";
            del.addEventListener("click", (e) => {
              e.stopPropagation();
              this.remove(item);
            });
            row.append(del);

            if (item === this.input.value) row.classList.add("selected");
            row.addEventListener("click", () => this._selectItem(item));

            this.itemsBox.append(row);
          });

          this._updatePagination();
          if (this.filteredData.length === 0) this._hideList();
        }

        _updatePagination() {
          const pages = Math.ceil(this.filteredData.length / this.itemsPerPage);
          this.prevBtn.disabled = this.currentPage === 0;
          this.nextBtn.disabled = this.currentPage >= pages - 1;
          this.prevBtn.parentElement.style.display =
            pages > 1 ? "flex" : "none";
        }

        _showList() {
          window.dispatchEvent(
            new CustomEvent("dropdownOpened", {
              detail: { dropdown: this },
              bubbles: true,
            })
          );
          // posiciona acima/abaixo conforme espaço disponível
          this.list.style.visibility = "hidden";
          this.list.style.display = "block";
          const rect = this.input.getBoundingClientRect();
          const h = this.list.scrollHeight;
          const below = window.innerHeight - rect.bottom;
          const above = rect.top;
          if (below < h && above > h) {
            this.list.style.top = "auto";
            this.list.style.bottom = `${rect.height}px`;
          } else {
            this.list.style.top = "calc(100% + .8dvmin)";
            this.list.style.bottom = "auto";
          }
          this.list.style.visibility = "visible";
          this.list.classList.add("open");
        }

        _hideList() {
          this.list.classList.remove("open");
          this.list.style.display = "none";
          this.list.style.top = "";
          this.list.style.bottom = "";
        }
        _toggleList() {
          this.list.classList.contains("open")
            ? this._hideList()
            : this._showList();
        }

        _selectItem(item) {
          this.itemsBox
            .querySelectorAll(".fd-item")
            .forEach((el) =>
              el.classList.toggle(
                "selected",
                el.querySelector(".fd-label").textContent === item
              )
            );
          this.input.value = item;
          this._hideList();
        }

        /* Helpers */
        _sanitize(v) {
          return (v ?? "").trim();
        }
        _exists(v) {
          const needle = v.toLowerCase();
          return (
            this.unique && this.data.some((x) => x.toLowerCase() === needle)
          );
        }

        addFromInput() {
          const v = this._sanitize(this.input.value);
          if (!v) return;
          this.add(v);
          // limpar filtro para mostrar a lista completa e não "sumir" com os itens
          this.input.value = "";
          this._filterItems("");
          this._showList();
        }

        add(v) {
          const val = this._sanitize(v);
          if (!val) return;
          if (this._exists(val)) return;
          if (this.data.length >= this.maxItems) return; // trava BETWEEN, por exemplo
          this.data.push(val);
          this.data.sort((a, b) => a.localeCompare(b));
          this._filterItems(this.input.value.trim());
          this._emitChange();
        }

        remove(v) {
          const needle = (v ?? "").toString().toLowerCase();
          const beforeLen = this.data.length;
          this.data = this.data.filter((x) => x.toLowerCase() !== needle);
          if (this.data.length !== beforeLen) {
            this._filterItems(this.input.value.trim());
            if (this.filteredData.length === 0 && this.currentPage > 0)
              this._changePage(-1);
            this._emitChange();
          }
        }

        /* API pública */
        setData(arr) {
          this.data = [...arr];
          this._filterItems(this.input.value.trim());
          this._emitChange();
        }
        getData() {
          return [...this.data];
        }
        destroy() {
          document.removeEventListener("mousedown", this._handleOutside);
          window.removeEventListener("dropdownOpened", this._handleGlobal);
          this.container.replaceChildren();
        }

        _emitChange() {
          this.container.dispatchEvent(
            new CustomEvent("change", { detail: { values: this.getData() } })
          );
        }
      }

      // ==== Instâncias de exemplo ====
      const ddIN = new PagedAddableDropdown(document.getElementById("ddIN"), {
        data: [
          "SP",
          "RJ",
          "MG",
          "ES",
          "BA",
          "PE",
          "CE",
          "PR",
          "SC",
          "RS",
          "GO",
          "MT",
          "MS",
          "DF",
          "AM",
          "PA",
          "RR",
          "RO",
          "AC",
          "AP",
          "TO",
          "RN",
          "PB",
          "AL",
          "PI",
          "MA",
        ],
        itemsPerPage: 6, // paginar de 6 em 6
        maxItems: Infinity, // IN: sem limite prático
      });

      const ddBT = new PagedAddableDropdown(
        document.getElementById("ddBETWEEN"),
        {
          data: [],
          itemsPerPage: 6,
          maxItems: 2, // BETWEEN: máximo 2 itens
        }
      );

      // Saída JSON (exemplo de integração)
      const outIN = document.getElementById("outIN");
      const outBT = document.getElementById("outBT");
      const btnIN = document.getElementById("btnIN");
      const btnBT = document.getElementById("btnBT");

      function updateOut(el, arr) {
        el.textContent = JSON.stringify(arr);
      }

      // clique "Ler JSON"
      btnIN.addEventListener("click", () => updateOut(outIN, ddIN.getData()));
      btnBT.addEventListener("click", () => updateOut(outBT, ddBT.getData()));

      // também atualiza em tempo real, se preferir
      document
        .getElementById("ddIN")
        .addEventListener("change", (e) => updateOut(outIN, e.detail.values));
      document
        .getElementById("ddBETWEEN")
        .addEventListener("change", (e) => updateOut(outBT, e.detail.values));
    </script>
  </body>
</html>
