<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>
      RELEX – Word-like (HF + caret estável) + Toolbar (nativa) + Cross-page
      DEL/BS (Class)
    </title>

    <style>
      :root {
        --page-w: 210mm;
        --page-h: 297mm;

        --margin: 20mm;
        --header-h: 28mm;
        --footer-h: 24mm;

        --guide: #777;
        --tag-bg: #e6e6e6;
        --tag-bd: #777;
      }
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #111;
        font-family: system-ui, Segoe UI, Arial;
        overflow: hidden;
      }

      .topbar {
        padding: 10px;
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .topbar button {
        margin-right: 6px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 10px;
        border-left: 1px solid rgba(255, 255, 255, 0.18);
      }

      /* botões simples */
      .toolbar button {
        background: #1b1b1b;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .toolbar button:hover {
        background: #2a2a2a;
      }

      /* controles NATIVOS */
      .toolbar select,
      .toolbar input[type="color"] {
        height: 28px;
      }

      .mode-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border: 1px solid #333;
        border-radius: 999px;
        font-size: 12px;
        opacity: 0.95;
      }
      .mode-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #39ff14;
        box-shadow: 0 0 12px rgba(57, 255, 20, 0.95);
      }
      .mode-pill.ovr .mode-dot {
        background: #ff0033;
        box-shadow: 0 0 12px rgba(255, 0, 51, 0.95);
      }

      .wrap {
        height: calc(100vh - 58px);
        overflow: auto;
        padding: 6px;
      }
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .page {
        width: var(--page-w);
        height: var(--page-h);
        background: #fff;
        border: 1px solid #cfcfcf;
        position: relative;
        transform: scale(1.05);
        transform-origin: top center;
      }

      .page-inner {
        position: absolute;
        inset: var(--margin);
        display: flex;
        flex-direction: column;
        border: none;
        overflow: hidden;
      }

      .band {
        position: relative;
        padding: 0;
        cursor: text;
      }

      .header {
        min-height: var(--header-h);
        height: auto;
      }
      .footer {
        min-height: var(--footer-h);
        height: auto;
      }
      .body {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .band .editable {
        padding: 6mm;
        outline: none;
        height: auto;
        overflow: visible;
        color: #111;
      }

      .editable.editing {
        background: transparent;
        outline: none;
        border-radius: 0;
        padding: 6mm;
        caret-color: #39ff14;
      }
      .editable.editing.ovr-caret {
        caret-color: #ff0033;
      }

      p {
        margin: 0 0 6px 0;
      }

      /* Labels só no modo HF */
      .band-label {
        display: none;
      }

      /* ===== HF: linha tracejada como BACKGROUND ===== */
      .page.hf .header {
        position: relative;
        background-image: repeating-linear-gradient(
          to right,
          var(--guide) 0 6px,
          transparent 6px 12px
        );
        background-repeat: repeat-x;
        background-size: 12px 1px;
        background-position: left 100%;
      }
      .page.hf .footer {
        position: relative;
        background-image: repeating-linear-gradient(
          to right,
          var(--guide) 0 6px,
          transparent 6px 12px
        );
        background-repeat: repeat-x;
        background-size: 12px 1px;
        background-position: left 0%;
      }

      .page.hf .header .band-label {
        display: inline-block;
        position: absolute;
        left: 14px;
        bottom: 0;
        transform: translateY(50%);
        font-size: 12px;
        line-height: 1;
        background: var(--tag-bg);
        border: 1px solid var(--tag-bd);
        border-radius: 2px;
        padding: 3px 10px;
        user-select: none;
        pointer-events: none;
        z-index: 2;
      }
      .page.hf .footer .band-label {
        display: inline-block;
        position: absolute;
        left: 14px;
        top: 0;
        transform: translateY(-50%);
        font-size: 12px;
        line-height: 1;
        background: var(--tag-bg);
        border: 1px solid var(--tag-bd);
        border-radius: 2px;
        padding: 3px 10px;
        user-select: none;
        pointer-events: none;
        z-index: 2;
      }

      /* corpo apagado no modo HF */
      .page.hf .body {
        opacity: 0.45;
      }
      .page.hf .body * {
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div class="topbar">
      <button id="btnEdit">Editar</button>
      <button id="btnDone">Finalizar</button>

      <span id="modePill" class="mode-pill" title="Tecla INS alterna modo">
        <span class="mode-dot"></span>
        <strong id="modeText">INS</strong>
      </span>

      <div class="toolbar" aria-label="Formatação">
        <button id="tbBold" title="Negrito"><b>B</b></button>
        <button id="tbItalic" title="Itálico"><i>I</i></button>
        <button id="tbUnder" title="Sublinhado"><u>U</u></button>
        <button id="tbClear" title="Limpar formatação">Tx</button>

        <button id="tbLeft" title="Alinhar à esquerda">⟸</button>
        <button id="tbCenter" title="Centralizar">≡</button>
        <button id="tbRight" title="Alinhar à direita">⟹</button>
        <button id="tbJust" title="Justificar">☰</button>

        <select id="tbFont" title="Fonte">
          <option value="">Fonte</option>
          <option>Arial</option>
          <option>Times New Roman</option>
          <option>Calibri</option>
          <option>Courier New</option>
          <option>Georgia</option>
          <option>Verdana</option>
        </select>

        <select id="tbSize" title="Tamanho">
          <option value="">Tam</option>
          <option value="1">8</option>
          <option value="2">10</option>
          <option value="3">12</option>
          <option value="4">14</option>
          <option value="5">18</option>
          <option value="6">24</option>
          <option value="7">36</option>
        </select>

        <input id="tbColor" type="color" title="Cor" />
      </div>
    </div>

    <div class="wrap">
      <div id="stage" class="stage"></div>
    </div>

    <script>
      class RelexEditor {
        constructor(opts = {}) {
          // elementos
          this.stage = opts.stage;

          this.btnEdit = opts.btnEdit;
          this.btnDone = opts.btnDone;

          this.modePill = opts.modePill;
          this.modeText = opts.modeText;

          this.tbBold = opts.tbBold;
          this.tbItalic = opts.tbItalic;
          this.tbUnder = opts.tbUnder;
          this.tbClear = opts.tbClear;

          this.tbLeft = opts.tbLeft;
          this.tbCenter = opts.tbCenter;
          this.tbRight = opts.tbRight;
          this.tbJust = opts.tbJust;

          this.tbFont = opts.tbFont;
          this.tbSize = opts.tbSize;
          this.tbColor = opts.tbColor;

          // estado
          this.active = null;
          this.insertMode = true;
          this.MAX_P_HF = 10;

          this.savedRange = null;

          // binds
          this._handlers = [];
          this._mounted = false;
        }

        mount() {
          if (this._mounted) return;
          this._mounted = true;

          // 1) cria primeira página
          this.stage.appendChild(this.createPage());

          // 2) seed
          const h = this.stage.querySelector(".header-ed");
          const f = this.stage.querySelector(".footer-ed");
          const b = this.stage.querySelector(".body-ed");
          h.innerHTML = "<p>Empresa XYZ</p>";
          f.innerHTML = "<p>Rodapé</p>";
          b.innerHTML = "<p>Duplo clique para editar.</p>";

          // 3) listeners globais + toolbar
          this.bindUI();

          // 4) auto-start
          setTimeout(() => {
            this.insertMode = true;
            this.updateModeUI();
            this.startEdit(b);
            this.normalizeParagraphs(b);
            this.placeCaretEnd(b.querySelector("p:last-child"));
          }, 0);
        }

        destroy() {
          for (const { target, type, fn, opt } of this._handlers) {
            target.removeEventListener(type, fn, opt);
          }
          this._handlers = [];
          this._mounted = false;
          this.active = null;
          this.savedRange = null;
        }

        on(target, type, fn, opt) {
          target.addEventListener(type, fn, opt);
          this._handlers.push({ target, type, fn, opt });
        }

        /* =========================
           UI / STATE
        ========================= */
        updateModeUI() {
          this.modeText.textContent = this.insertMode ? "INS" : "OVR";
          this.modePill.classList.toggle("ovr", !this.insertMode);
          this.updateCaretUI();
        }
        updateCaretUI() {
          if (!this.active) return;
          this.active.classList.toggle("ovr-caret", !this.insertMode);
        }

        getPageFrom(el) {
          return el?.closest?.(".page") || null;
        }
        setHfModeForPage(pg, on) {
          if (pg) pg.classList.toggle("hf", !!on);
        }
        isHeaderOrFooter(ed) {
          return (
            ed.classList.contains("header-ed") ||
            ed.classList.contains("footer-ed")
          );
        }
        countParagraphs(ed) {
          return ed.querySelectorAll(":scope > p").length;
        }

        /* =========================
           SELECTION / CARET
        ========================= */
        getSelectionRange() {
          const sel = window.getSelection();
          if (!sel || !sel.rangeCount) return null;
          return sel.getRangeAt(0);
        }
        getActiveParagraph() {
          const r = this.getSelectionRange();
          if (!r) return null;
          const node =
            r.startContainer.nodeType === 3
              ? r.startContainer.parentNode
              : r.startContainer;
          return node.closest?.("p") || null;
        }
        placeCaretEnd(node) {
          const r = document.createRange();
          r.selectNodeContents(node);
          r.collapse(false);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        }
        placeCaretStart(node) {
          const r = document.createRange();
          r.selectNodeContents(node);
          r.collapse(true);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        }

        ensureHasParagraph(container) {
          if (container.querySelector(":scope > p")) return;
          const p = document.createElement("p");
          p.appendChild(document.createElement("br"));
          container.appendChild(p);
          this.placeCaretStart(p);
        }

        isCaretAtEndOfParagraph(p, range) {
          if (!range || !range.collapsed) return false;
          const post = document.createRange();
          post.selectNodeContents(p);
          post.setStart(range.startContainer, range.startOffset);
          return post.toString() === "";
        }
        isCaretAtStartOfParagraph(p, range) {
          if (!range || !range.collapsed) return false;
          const pre = document.createRange();
          pre.selectNodeContents(p);
          pre.setEnd(range.startContainer, range.startOffset);
          return pre.toString() === "";
        }

        isEmptyP(p) {
          const txt = (p.textContent || "").replace(/\u00A0/g, " ").trim();
          if (txt !== "") return false;
          const els = [...p.childNodes].filter((n) => n.nodeType === 1);
          return (
            els.length === 0 || (els.length === 1 && els[0].tagName === "BR")
          );
        }
        isBodyEffectivelyEmpty(bodyEd) {
          const ps = [...bodyEd.querySelectorAll(":scope > p")];
          if (ps.length !== 1) return false;
          return this.isEmptyP(ps[0]);
        }

        normalizeParagraphs(ed) {
          const nodes = [...ed.childNodes];
          for (const n of nodes) {
            if (n.nodeType === 3) {
              const txt = n.textContent;
              n.remove();
              const p = document.createElement("p");
              p.textContent = txt;
              ed.appendChild(p);
            } else if (n.nodeType === 1) {
              const tag = n.tagName;
              if (tag === "DIV") {
                const p = document.createElement("p");
                p.innerHTML = n.innerHTML;
                n.replaceWith(p);
              } else if (tag !== "P") {
                const p = document.createElement("p");
                p.appendChild(n);
                ed.appendChild(p);
              }
            }
          }

          ed.querySelectorAll(":scope > p").forEach((p) => {
            const txt = (p.textContent || "").replace(/\u00A0/g, " ").trim();
            if (txt === "" && p.querySelectorAll("br").length === 0) {
              p.innerHTML = "";
              p.appendChild(document.createElement("br"));
            }
          });

          this.ensureHasParagraph(ed);
        }

        /* =========================
           PAGE FACTORY
        ========================= */
        createPage() {
          const p = document.createElement("div");
          p.className = "page";
          p.innerHTML = `
  <div class="page-inner">
    <div class="band header">
      <div class="band-label">Cabeçalho</div>
      <div class="editable header-ed"></div>
    </div>

    <div class="band body">
      <div class="editable body-ed"></div>
    </div>

    <div class="band footer">
      <div class="band-label">Rodapé</div>
      <div class="editable footer-ed"></div>
    </div>
  </div>`;

          p.querySelectorAll(".editable").forEach((ed) => this.wireEditable(ed));

          // clicar no fundo ativa; clicar/arrastar dentro do conteúdo mantém seleção
          p.querySelector(".header").addEventListener("mousedown", (e) => {
            if (e.target.closest(".editable")) return;
            e.preventDefault();
            const hed = p.querySelector(".header-ed");
            this.startEdit(hed);
            this.ensureHasParagraph(hed);
            this.placeCaretEnd(hed.querySelector("p:last-child"));
          });

          p.querySelector(".footer").addEventListener("mousedown", (e) => {
            if (e.target.closest(".editable")) return;
            e.preventDefault();
            const fed = p.querySelector(".footer-ed");
            this.startEdit(fed);
            this.ensureHasParagraph(fed);
            this.placeCaretStart(fed.querySelector("p:first-child"));
          });

          p.querySelector(".body").addEventListener("mousedown", (e) => {
            if (e.target.closest(".editable")) return;
            e.preventDefault();
            const bed = p.querySelector(".body-ed");
            this.startEdit(bed);
            this.ensureHasParagraph(bed);
            this.placeCaretEnd(bed.querySelector("p:last-child"));
          });

          return p;
        }

        createNextPage() {
          const p = this.createPage();
          const first = this.stage.querySelector(".page");
          p.querySelector(".header-ed").innerHTML =
            first.querySelector(".header-ed").innerHTML;
          p.querySelector(".footer-ed").innerHTML =
            first.querySelector(".footer-ed").innerHTML;
          this.stage.appendChild(p);
          return p;
        }

        /* =========================
           EDIT MODE
        ========================= */
        startEdit(el) {
          this.stopEdit();
          this.active = el;

          el.spellcheck = false;
          el.contentEditable = "true";
          el.classList.add("editing");
          this.updateCaretUI();
          el.focus({ preventScroll: true });

          this.normalizeParagraphs(el);

          const pg = this.getPageFrom(el);
          this.setHfModeForPage(pg, this.isHeaderOrFooter(el));
        }

        stopEdit() {
          if (!this.active) return;
          const pg = this.getPageFrom(this.active);
          this.active.contentEditable = "false";
          this.active.classList.remove("editing", "ovr-caret");
          this.active = null;
          this.setHfModeForPage(pg, false);
        }

        /* =========================
           PAGINATION (BODY only)
        ========================= */
        paginate() {
          const pages = [...this.stage.querySelectorAll(".page")];

          const ensureNextPage = (i) => {
            if (pages[i + 1]) return pages[i + 1];
            const created = this.createNextPage();
            pages.push(created);
            return created;
          };

          pages.forEach((pg, i) => {
            const bodyEd = pg.querySelector(".body-ed");
            const bodyBox = pg.querySelector(".body");
            if (!bodyEd || !bodyBox) return;

            while (bodyEd.scrollHeight > bodyBox.clientHeight + 1) {
              const lastP = bodyEd.querySelector(":scope > p:last-child");
              if (!lastP) break;

              const next = ensureNextPage(i);
              const nb = next.querySelector(".body-ed");
              if (!nb) break;

              nb.insertBefore(lastP, nb.firstChild);
            }
          });

          this.pruneEmptyTailPages();
        }

        pruneEmptyTailPages() {
          let pages = [...this.stage.querySelectorAll(".page")];
          for (let i = pages.length - 1; i > 0; i--) {
            const pg = pages[i];
            const body = pg.querySelector(".body-ed");
            if (!body) break;

            if (this.isBodyEffectivelyEmpty(body)) {
              if (this.active && pg.contains(this.active)) {
                const prev = pages[i - 1];
                const prevBody = prev.querySelector(".body-ed");
                this.startEdit(prevBody);
                this.normalizeParagraphs(prevBody);
                this.placeCaretEnd(prevBody.querySelector("p:last-child"));
              }
              pg.remove();
            } else {
              break;
            }
            pages = [...this.stage.querySelectorAll(".page")];
          }
        }

        /* =========================
           EDITABLE RULES
        ========================= */
        wireEditable(el) {
          el.addEventListener("beforeinput", (e) => {
            if (el !== this.active) return;
            if (e.isComposing) return;

            // bloqueio do Enter no header/footer
            if (this.isHeaderOrFooter(el)) {
              const isEnter =
                e.inputType === "insertParagraph" ||
                e.inputType === "insertLineBreak";
              if (isEnter && this.countParagraphs(el) >= this.MAX_P_HF) {
                e.preventDefault();
                return;
              }
            }

            // OVR: apaga 1 char à direita antes de inserir
            if (
              !this.insertMode &&
              e.inputType === "insertText" &&
              typeof e.data === "string" &&
              e.data.length === 1
            ) {
              const r = this.getSelectionRange();
              if (!r || !r.collapsed) return;
              const sc = r.startContainer;
              const so = r.startOffset;
              if (sc && sc.nodeType === 3 && so < sc.data.length) {
                sc.deleteData(so, 1);
              }
            }
          });

          el.addEventListener("input", () => {
            if (el !== this.active) return;
            this.normalizeParagraphs(el);
            requestAnimationFrame(() => this.paginate());
          });

          el.addEventListener("keydown", (e) => {
            if (el !== this.active) return;

            // DEL cross-page no BODY
            if (e.key === "Delete" && el.classList.contains("body-ed")) {
              const r = this.getSelectionRange();
              const p = this.getActiveParagraph();
              if (r && p && this.isCaretAtEndOfParagraph(p, r)) {
                const isLastP = !p.nextElementSibling;
                if (isLastP) {
                  const pages = [...this.stage.querySelectorAll(".page")];
                  const pg = this.getPageFrom(el);
                  const i = pages.indexOf(pg);
                  const nextPg = i >= 0 ? pages[i + 1] : null;

                  if (nextPg) {
                    const nextBody = nextPg.querySelector(".body-ed");
                    const firstNextP = nextBody?.querySelector(
                      ":scope > p:first-child",
                    );
                    if (firstNextP) {
                      e.preventDefault();
                      el.appendChild(firstNextP);
                      this.ensureHasParagraph(nextBody);
                      this.placeCaretEnd(p);
                      requestAnimationFrame(() => this.paginate());
                      return;
                    }
                  }
                }
              }
            }

            // BACKSPACE cross-page no BODY
            if (e.key === "Backspace" && el.classList.contains("body-ed")) {
              const r = this.getSelectionRange();
              const p = this.getActiveParagraph();
              if (r && p && this.isCaretAtStartOfParagraph(p, r)) {
                const isFirstP = !p.previousElementSibling;
                if (isFirstP) {
                  const pages = [...this.stage.querySelectorAll(".page")];
                  const pg = this.getPageFrom(el);
                  const i = pages.indexOf(pg);
                  const prevPg = i > 0 ? pages[i - 1] : null;

                  if (prevPg) {
                    const prevBody = prevPg.querySelector(".body-ed");
                    const lastPrevP = prevBody?.querySelector(
                      ":scope > p:last-child",
                    );
                    if (prevBody && lastPrevP) {
                      e.preventDefault();
                      prevBody.appendChild(p);
                      this.ensureHasParagraph(el);
                      this.placeCaretEnd(p);
                      requestAnimationFrame(() => this.paginate());
                      return;
                    }
                  }
                }
              }
            }

            // setas HF (troca header<->footer)
            if (e.key === "ArrowDown" && el.classList.contains("header-ed")) {
              const pg = this.getPageFrom(el);
              const p = this.getActiveParagraph();
              if (pg && p && !p.nextElementSibling) {
                e.preventDefault();
                const fed = pg.querySelector(".footer-ed");
                this.startEdit(fed);
                this.normalizeParagraphs(fed);
                this.placeCaretStart(fed.querySelector("p:first-child"));
              }
              return;
            }

            if (e.key === "ArrowUp" && el.classList.contains("footer-ed")) {
              const pg = this.getPageFrom(el);
              const p = this.getActiveParagraph();
              if (pg && p && !p.previousElementSibling) {
                e.preventDefault();
                const hed = pg.querySelector(".header-ed");
                this.startEdit(hed);
                this.normalizeParagraphs(hed);
                this.placeCaretEnd(hed.querySelector("p:last-child"));
              }
              return;
            }
          });
        }

        /* =========================
           TOOLBAR
        ========================= */
        saveSelection() {
          const sel = window.getSelection();
          if (sel && sel.rangeCount) this.savedRange = sel.getRangeAt(0).cloneRange();
        }
        restoreSelection() {
          if (!this.savedRange) return false;
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(this.savedRange);
          return true;
        }
        selectionInsideActive() {
          if (!this.active) return false;
          const sel = window.getSelection();
          if (!sel || sel.rangeCount === 0) return false;
          const r = sel.getRangeAt(0);
          const a =
            r.commonAncestorContainer.nodeType === 3
              ? r.commonAncestorContainer.parentNode
              : r.commonAncestorContainer;
          return this.active.contains(a);
        }
        applyCmd(cmd, value = null) {
          if (!this.active) return;
          if (!this.restoreSelection() && !this.selectionInsideActive()) return;
          document.execCommand(cmd, false, value);
        }

        /* =========================
           BIND UI (global + toolbar)
        ========================= */
        bindUI() {
          this.updateModeUI();

          // botões Edit/Done
          this.on(this.btnEdit, "click", () => {
            const b = this.stage.querySelector(".body-ed");
            this.startEdit(b);
            this.ensureHasParagraph(b);
            this.placeCaretEnd(b.querySelector("p:last-child"));
          });

          this.on(this.btnDone, "click", () => this.stopEdit());

          // INS
          this.on(document, "keydown", (e) => {
            if (!this.active) return;
            if (e.key === "Insert") {
              e.preventDefault();
              this.insertMode = !this.insertMode;
              this.updateModeUI();
            }
          });

          // ✅ clique/arrasto dentro de qualquer .editable => vira active (sem bloquear seleção)
          this.on(
            this.stage,
            "mousedown",
            (e) => {
              const ed = e.target.closest(".editable");
              if (!ed) return;
              if (ed !== this.active) this.startEdit(ed);
            },
            true,
          );

          // selectionchange: salva até caret colapsado
          this.on(document, "selectionchange", () => {
            if (!this.active) return;
            if (!this.selectionInsideActive()) return;
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) return;
            this.saveSelection();
          });

          // toolbar commands
          this.on(this.tbBold, "click", () => this.applyCmd("bold"));
          this.on(this.tbItalic, "click", () => this.applyCmd("italic"));
          this.on(this.tbUnder, "click", () => this.applyCmd("underline"));
          this.on(this.tbClear, "click", () => this.applyCmd("removeFormat"));

          this.on(this.tbLeft, "click", () => this.applyCmd("justifyLeft"));
          this.on(this.tbCenter, "click", () => this.applyCmd("justifyCenter"));
          this.on(this.tbRight, "click", () => this.applyCmd("justifyRight"));
          this.on(this.tbJust, "click", () => this.applyCmd("justifyFull"));

          this.on(this.tbFont, "change", (e) => {
            const v = e.target.value;
            if (!v) return;
            this.applyCmd("fontName", v);
            e.target.value = "";
          });

          this.on(this.tbSize, "change", (e) => {
            const v = e.target.value;
            if (!v) return;
            this.applyCmd("fontSize", v);
            e.target.value = "";
          });

          this.on(this.tbColor, "input", (e) => {
            const v = e.target.value;
            this.applyCmd("foreColor", v);
          });
        }
      }

      // ======= Instância =======
      const relex = new RelexEditor({
        stage: document.getElementById("stage"),

        btnEdit: document.getElementById("btnEdit"),
        btnDone: document.getElementById("btnDone"),

        modePill: document.getElementById("modePill"),
        modeText: document.getElementById("modeText"),

        tbBold: document.getElementById("tbBold"),
        tbItalic: document.getElementById("tbItalic"),
        tbUnder: document.getElementById("tbUnder"),
        tbClear: document.getElementById("tbClear"),

        tbLeft: document.getElementById("tbLeft"),
        tbCenter: document.getElementById("tbCenter"),
        tbRight: document.getElementById("tbRight"),
        tbJust: document.getElementById("tbJust"),

        tbFont: document.getElementById("tbFont"),
        tbSize: document.getElementById("tbSize"),
        tbColor: document.getElementById("tbColor"),
      });

      relex.mount();
      // se quiser desmontar depois:
      // relex.destroy();
    </script>
  </body>
</html>
