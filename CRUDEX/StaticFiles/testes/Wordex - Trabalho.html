<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Wordex</title>

    <style>
      :root {
        --page-w: 210mm;
        --page-h: 297mm;

        --margin: 20mm;
        --header-h: 28mm;
        --footer-h: 24mm;

        --guide: #777;
        --tag-bg: #e6e6e6;
        --tag-bd: #777;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #111;
        font-family:
          system-ui,
          Segoe UI,
          Arial;
        overflow: hidden;
      }

      .topbar {
        padding: 10px;
        background: #000;
        color: #fff;
        display: flex;
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
        flex-wrap: wrap;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 10px;
        border-left: 1px solid rgba(255, 255, 255, 0.18);
      }

      .toolbar button {
        background: #1b1b1b;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        padding: 4px 10px;
        cursor: pointer;
      }

      .toolbar button:hover {
        background: #2a2a2a;
      }

      .toolbar select,
      .toolbar input[type="color"] {
        height: 28px;
      }

      .mode-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border: 1px solid #333;
        border-radius: 999px;
        font-size: 12px;
        opacity: 0.95;
      }

      .mode-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #39ff14;
        box-shadow: 0 0 12px rgba(57, 255, 20, 0.95);
      }

      .mode-pill.ovr .mode-dot {
        background: #ff0033;
        box-shadow: 0 0 12px rgba(255, 0, 51, 0.95);
      }

      .wrap {
        height: calc(100vh - 58px);
        overflow: auto;
        padding: 6px;
      }

      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .page {
        width: var(--page-w);
        height: auto;
        background: #fff;
        border: 1px solid #cfcfcf;
        position: relative;
        transform-origin: top center;
        min-height: var(--page-h);
      }

      .page-inner {
        position: relative;
        margin: var(--margin);
        display: flex;
        flex-direction: column;
        overflow: visible;
      }

      .band {
        position: relative;
        padding: 1px;
        cursor: text;
      }

      .header {
        min-height: var(--header-h);
        padding: 1px;
        height: auto;
      }

      .footer {
        min-height: var(--footer-h);
        padding: 1px;
        height: auto;
      }

      .body {
        flex: 1;
        min-height: 0;
        overflow: visible;
      }

      /* linhas-guia: header (embaixo) e footer (em cima) */
      .band.header {
        border-bottom: 1px dashed #bbb;
      }

      .band.footer {
        border-top: 1px dashed #bbb;
      }

      .band.header:has(.editable.editing) {
        border-bottom: none;
      }
      .band.footer:has(.editable.editing) {
        border-top: none;
      }

      .band .editable {
        padding: 6mm;
        outline: none;
        height: auto;
        overflow: visible;
        color: #111;
      }

      .editable.editing {
        background: transparent;
        outline: none;
        border-radius: 0;
        padding: 6mm;
        caret-color: #39ff14;
      }

      .editable.editing.ovr-caret {
        caret-color: #ff0033;
      }

      p {
        margin: 0 0 6px 0;
      }

      /* ===== IMAGEM dentro do <p> ===== */
      .rx-img {
        display: inline-block;
        vertical-align: baseline;
        max-width: 100%;
        height: auto;
        width: var(--iw, 80px);
      }

      .rx-img.sel {
        outline: 2px solid rgba(57, 255, 20, 0.85);
        outline-offset: 2px;
      }

      /* ===== TABELA (inline, dentro do <p>) ===== */
      .rx-tbl-wrap {
        display: inline-block;
        vertical-align: baseline;
        padding: 1px; /* <<< espaço pro raio aparecer */
        border-radius: 0px; /* pode ser 0 por default, tanto faz */
        border: 0 solid transparent;
        overflow: hidden; /* recorta as células no raio */
        background: #fff; /* fundo do padding */
      }

      .rx-tbl {
        border-collapse: collapse;
        border-spacing: 0;
        font-size: inherit;
      }

      .rx-tbl td {
        border: 1px solid #999;
        padding: 2px 6px;
        min-width: 28px;
        height: 22px;
        user-select: text;
      }

      /* Seleção da TABELA: sempre quadrada */
      .rx-tbl-wrap {
        position: relative;
      }

      /* Seleção de CÉLULA: sempre quadrada */
      .rx-tbl td.sel-cell {
        position: relative;
      }

      /* Seleção de COLUNA: sempre quadrada */
      .rx-tbl td.sel-col {
        position: relative;
      }

      /* Seleção de LINHA: sempre quadrada (por célula) */
      .rx-tbl tr.sel-row > td {
        position: relative;
      }

      /* seleção NÃO muda layout */
      .rx-tbl-wrap.sel-table {
        box-shadow: 0 0 0 2px rgba(57, 255, 20, 0.85);
      }

      /* CÉLULA */
      .rx-tbl td.sel-cell {
        position: relative;
      }
      .rx-tbl td.sel-cell::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 2px solid rgba(57, 255, 20, 0.85);
        border-radius: inherit; /* <<< pega o radius do td */
        pointer-events: none;
      }

      /* COLUNA */
      .rx-tbl td.sel-col {
        position: relative;
      }
      .rx-tbl td.sel-col::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 2px solid rgba(57, 255, 20, 0.55);
        border-radius: inherit; /* <<< pega o radius do td */
        pointer-events: none;
      }

      /* LINHA (por célula) */
      .rx-tbl tr.sel-row > td {
        position: relative;
      }
      .rx-tbl tr.sel-row > td::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 2px solid rgba(57, 255, 20, 0.85);
        border-radius: inherit; /* <<< pega o radius do td */
        pointer-events: none;
      }

      /* por padrão: sem destaque */
      .editable.header-ed,
      .editable.footer-ed {
        background: transparent;
      }

      /* destaque só quando estiver editando */
      .editable.header-ed.editing,
      .editable.footer-ed.editing {
        background: rgba(
          230,
          230,
          230,
          0.55
        ); /* ou use var(--tag-bg) com alpha */
      }
    </style>
  </head>

  <body>
    <div class="topbar">
      <div class="toolbar">
        <span id="modePill" class="mode-pill" title="Tecla INS alterna modo">
          <span class="mode-dot"></span>
          <strong id="modeText">INS</strong>
        </span>

        <button id="tbOrientation" title="Retrato / Paisagem">🗎⇄</button>

        <button id="tbBold" title="Negrito"><b>B</b></button>
        <button id="tbItalic" title="Itálico"><i>I</i></button>
        <button id="tbUnder" title="Sublinhado"><u>U</u></button>
        <button id="tbClear" title="Limpar formatação">Tx</button>

        <button id="tbLeft" title="Alinhar à esquerda">⟸</button>
        <button id="tbCenter" title="Centralizar">≡</button>
        <button id="tbRight" title="Alinhar à direita">⟹</button>
        <button id="tbJust" title="Justificar">☰</button>

        <select id="tbFont" title="Fonte">
          <option value="">Fonte</option>
          <option>Arial</option>
          <option>Times New Roman</option>
          <option>Calibri</option>
          <option>Courier New</option>
          <option>Georgia</option>
          <option>Verdana</option>
        </select>

        <select id="tbSize" title="Tamanho">
          <option value="">Tam</option>
          <option value="1">8</option>
          <option value="2">10</option>
          <option value="3">12</option>
          <option value="4">14</option>
          <option value="5">18</option>
          <option value="6">24</option>
          <option value="7">36</option>
        </select>

        <select id="tbBorder" title="Borda (px)">
          <option value="">Borda</option>
          <option value="none">0 px</option>
          <option value="1">1 px</option>
          <option value="2">2 px</option>
          <option value="3">3 px</option>
          <option value="4">4 px</option>
          <option value="6">6 px</option>
          <option value="8">8 px</option>
        </select>

        <select id="tbRadius" title="Arredondamento">
          <option value="">Arred.</option>
          <option value="0">0</option>
          <option value="4">4</option>
          <option value="6">6</option>
          <option value="8">8</option>
          <option value="12">12</option>
          <option value="16">16</option>
        </select>

        <input id="tbColor" type="color" title="Cor" />

        <!-- Só LEFT/RIGHT (UP/DOWN removido) -->
        <button
          id="tbImgLeft"
          title="Mover imagem/tabela 1 caractere p/ esquerda"
        >
          ←
        </button>
        <button
          id="tbImgRight"
          title="Mover imagem/tabela 1 caractere p/ direita"
        >
          →
        </button>

        <button id="tbTag" title="Atribuir tag à imagem/tabela selecionada">
          🏷️ Tag
        </button>

        <span style="opacity: 0.7; margin-left: 6px">Imagem:</span>
        <button id="tbImgIns" title="Inserir imagem (no cursor)">🖼️+</button>
        <button id="tbImgSm" title="Diminuir largura">－</button>
        <button id="tbImgLg" title="Aumentar largura">＋</button>

        <input id="tbImgFile" type="file" accept="image/*" hidden />
      </div>

      <div class="toolbar">
        <span>Tabela:</span>
        <button id="tbTblNew" title="Inserir tabela">▦+</button>
        <select id="tbRowKind" title="Tipo da linha selecionada">
          <option value="">Tipo da linha</option>
          <option value="titles">Títulos de coluna</option>
          <option value="group">Grupo</option>
          <option value="detail">Detalhe</option>
          <option value="total">Total de grupo</option>
        </select>
      </div>
    </div>

    <div class="wrap">
      <div id="stage" class="stage"></div>
    </div>

    <script>
      class WordexEditor {
        constructor({ stage, modePill, modeText }) {
          this.stage = stage;
          this.modePill = modePill;
          this.modeText = modeText;

          this.active = null;
          this.insertMode = true;
          this.savedRange = null;

          // imagem
          this.activeImg = null;

          // tabela
          this.activeTbl = null; // span wrapper
          this.activeTblRow = null; // <tr> selecionado
          this.activeTblCell = null; // <td> selecionado
          this.activeTblCol = null; // índice da coluna selecionada

          this._onGlobalKeyDown = this._onGlobalKeyDown.bind(this);
          this._onStageMouseDown = this._onStageMouseDown.bind(this);
          this._onSelectionChange = this._onSelectionChange.bind(this);
        }

        init() {
          this.stage.appendChild(this._createPage());
          this._wireTopbar();
          this._wireStageDelegation();
          this._wireToolbar();

          const first = this.stage.querySelector(".page");

          queueMicrotask(() => {
            const b = first.querySelector(".body-ed");
            this.insertMode = true;
            this._updateModeUI();
            this.startEdit(b);
            this._normalizeParagraphs(b);
            this._placeCaretEnd(b.querySelector("p:last-child"));
          });
        }

        _updateModeUI() {
          this.modeText.textContent = this.insertMode ? "INS" : "OVR";
          this.modePill.classList.toggle("ovr", !this.insertMode);
          if (this.active)
            this.active.classList.toggle("ovr-caret", !this.insertMode);
        }

        _getSelectionRange() {
          const sel = window.getSelection();
          if (!sel || !sel.rangeCount) return null;
          return sel.getRangeAt(0);
        }

        _getActiveParagraph() {
          const r = this._getSelectionRange();
          if (!r) return null;
          const node =
            r.startContainer.nodeType === 3
              ? r.startContainer.parentNode
              : r.startContainer;
          return node.closest?.("p") || null;
        }

        _placeCaretEnd(node) {
          const r = document.createRange();
          r.selectNodeContents(node);
          r.collapse(false);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        }

        _placeCaretStart(node) {
          const r = document.createRange();
          r.selectNodeContents(node);
          r.collapse(true);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        }

        _ensureHasParagraph(ed) {
          if (ed.querySelector(":scope > p")) return;
          const p = document.createElement("p");
          p.appendChild(document.createElement("br"));
          ed.appendChild(p);
          this._placeCaretStart(p);
        }

        _normalizeParagraphs(ed) {
          const nodes = [...ed.childNodes];

          for (const n of nodes) {
            if (n.nodeType === 3) {
              const txt = n.textContent;
              n.remove();
              const p = document.createElement("p");
              p.textContent = txt;
              ed.appendChild(p);
            } else if (n.nodeType === 1) {
              const tag = n.tagName;
              if (tag === "DIV") {
                const p = document.createElement("p");
                p.innerHTML = n.innerHTML;
                n.replaceWith(p);
              } else if (tag !== "P") {
                const p = document.createElement("p");
                p.appendChild(n);
                ed.appendChild(p);
              }
            }
          }

          ed.querySelectorAll(":scope > p").forEach((p) => {
            const txt = (p.textContent || "").replace(/\u00A0/g, " ").trim();
            if (txt === "" && p.querySelectorAll("br").length === 0) {
              p.innerHTML = "";
              p.appendChild(document.createElement("br"));
            }
          });

          this._ensureHasParagraph(ed);
        }

        _createPage() {
          const p = document.createElement("div");
          p.className = "page";
          p.innerHTML = `
            <div class="page-inner">
              <div class="band header"><div class="editable header-ed"></div></div>
              <div class="band body"><div class="editable body-ed"></div></div>
              <div class="band footer"><div class="editable footer-ed"></div></div>
            </div>`;

          p.querySelectorAll(".editable").forEach((ed) =>
            this._wireEditable(ed),
          );
          return p;
        }

        startEdit(ed) {
          if (this.active === ed) return;

          this.stopEdit();

          this.active = ed;
          ed.spellcheck = false;
          ed.contentEditable = "true";
          ed.classList.add("editing");
          ed.classList.toggle("ovr-caret", !this.insertMode);
          ed.focus({ preventScroll: true });

          this._normalizeParagraphs(ed);
        }

        stopEdit() {
          if (!this.active) return;
          this.active.contentEditable = "false";
          this.active.classList.remove("editing", "ovr-caret");
          this.active = null;
        }

        _wireTopbar() {
          this._updateModeUI();
          document.addEventListener("keydown", this._onGlobalKeyDown);
          document.addEventListener("selectionchange", this._onSelectionChange);
        }

        _onGlobalKeyDown(e) {
          if (!this.active) return;
          if (e.key === "Insert") {
            e.preventDefault();
            this.insertMode = !this.insertMode;
            this._updateModeUI();
          }
        }

        _wireStageDelegation() {
          this.stage.addEventListener(
            "mousedown",
            this._onStageMouseDown,
            true,
          );
        }

        _onStageMouseDown(e) {
          if (e.target.closest(".topbar")) return;
          if (!e.target.closest(".rx-tbl-wrap")) this._clearActiveTable();
          if (e.button !== 0) return;

          // 1) Se clicou DENTRO do conteúdo editável, deixa o browser posicionar o caret
          const ed = e.target.closest(".editable");
          if (ed) {
            if (ed !== this.active) this.startEdit(ed);
            return; // <-- sem preventDefault aqui
          }

          // 2) Clique em qualquer área da banda (header/body/footer), fora do .editable
          const band = e.target.closest(".band");
          if (!band) return;

          e.preventDefault();

          const targetEd = band.querySelector(".editable");
          if (!targetEd) return;

          this.startEdit(targetEd);
          this._ensureHasParagraph(targetEd);

          // aqui sim: como não houve clique no texto, decide posição padrão
          if (targetEd.classList.contains("footer-ed")) {
            this._placeCaretStart(targetEd.querySelector("p:first-child"));
          } else {
            this._placeCaretEnd(targetEd.querySelector("p:last-child"));
          }
        }

        _clearActiveTable() {
          if (this.activeTblCell)
            this.activeTblCell.classList.remove("sel-cell");
          if (this.activeTblRow) this.activeTblRow.classList.remove("sel-row");
          if (this.activeTbl) {
            this.activeTbl.classList.remove("sel-table");
            this.activeTbl
              .querySelectorAll("td.sel-col")
              .forEach((td) => td.classList.remove("sel-col"));
          }

          this.activeTbl = null;
          this.activeTblRow = null;
          this.activeTblCell = null;
          this.activeTblCol = null;

          const sel = document.getElementById("tbRowKind");
          if (sel) sel.value = "";
        }

        _toggleTblRow(tblWrap, tr) {
          if (this.activeTbl && this.activeTbl !== tblWrap)
            this._clearActiveTable();

          const isSame = this.activeTbl === tblWrap && this.activeTblRow === tr;
          if (isSame) {
            if (this.activeTblRow)
              this.activeTblRow.classList.remove("sel-row");
            this.activeTblRow = null;
            if (!this.activeTbl) this._setActiveTable(tblWrap);
            const sel = document.getElementById("tbRowKind");
            if (sel) sel.value = "";
            return;
          }
          this._setActiveTblRow(tblWrap, tr);
        }

        _wireEditable(ed) {
          ed.addEventListener(
            "mousedown",
            (e) => {
              // TABELA
              const tbl = e.target.closest?.(".rx-tbl-wrap");
              if (tbl) {
                const tr = e.target.closest("tr");
                const td = e.target.closest("td");

                if (e.ctrlKey) {
                  e.preventDefault();
                  e.stopPropagation();

                  // ctrl+click em TD: ciclo tabela -> linha -> coluna -> tabela
                  if (td) {
                    // 1) se ainda não é a tabela ativa: seleciona tabela
                    if (this.activeTbl !== tbl) {
                      this._setActiveTable(tbl);
                      return;
                    }

                    // 2) se só a tabela está selecionada: seleciona linha
                    if (
                      this.activeTbl &&
                      !this.activeTblRow &&
                      this.activeTblCol == null &&
                      !this.activeTblCell
                    ) {
                      if (tr) this._setActiveTblRow(tbl, tr);
                      return;
                    }

                    // 3) se a linha está selecionada: seleciona coluna
                    if (this.activeTblRow) {
                      this._setActiveTblCol(tbl, td.cellIndex);
                      return;
                    }

                    // 4) se a coluna está selecionada: volta pra tabela
                    if (this.activeTblCol != null) {
                      this._setActiveTable(tbl);
                      return;
                    }

                    // fallback
                    this._setActiveTable(tbl);
                    return;
                  }

                  // ctrl+click fora de td: tabela
                  if (tr) {
                    // se ctrl+click pegou TR sem TD, mantém seu comportamento antigo
                    this._toggleTblRow(tbl, tr);
                    return;
                  }

                  this._setActiveTable(tbl);
                  return;
                }

                if (td) {
                  this._setActiveTblCell(tbl, td);
                  return;
                }

                this._setActiveTable(tbl);
                return;
              }

              // IMAGEM
              const img = e.target.closest?.("img.rx-img");
              if (img) {
                this._setActiveImg(img);
                return;
              }

              // fora
              this._clearActiveImg();
              this._clearActiveTable();
            },
            true,
          );

          ed.addEventListener("beforeinput", (e) => {
            if (ed !== this.active) return;
            if (e.isComposing) return;

            if (
              !this.insertMode &&
              e.inputType === "insertText" &&
              typeof e.data === "string" &&
              e.data.length === 1
            ) {
              const r = this._getSelectionRange();
              if (!r || !r.collapsed) return;
              const sc = r.startContainer;
              const so = r.startOffset;
              if (sc && sc.nodeType === 3 && so < sc.data.length)
                sc.deleteData(so, 1);
            }
          });

          ed.addEventListener("input", () => {
            if (ed !== this.active) return;
            this._normalizeParagraphs(ed);
          });
        }

        _wireToolbar() {
          const $ = (id) => document.getElementById(id);

          const applyCmd = (cmd, value = null) => {
            if (!this.active) return;
            if (!this._restoreSelection() && !this._selectionInsideActive())
              return;

            const host = this._getCommandHost();
            if (!host) return;

            host.focus({ preventScroll: true });
            document.execCommand(cmd, false, value);
            this._saveSelection();
          };

          $("tbBold").onclick = () => applyCmd("bold");
          $("tbItalic").onclick = () => applyCmd("italic");
          $("tbUnder").onclick = () => applyCmd("underline");
          $("tbClear").onclick = () => applyCmd("removeFormat");

          $("tbLeft").onclick = () => applyCmd("justifyLeft");
          $("tbCenter").onclick = () => applyCmd("justifyCenter");
          $("tbRight").onclick = () => applyCmd("justifyRight");
          $("tbJust").onclick = () => applyCmd("justifyFull");

          $("tbFont").onchange = (e) => {
            const v = e.target.value;
            if (!v) return;
            applyCmd("fontName", v);
            e.target.value = "";
          };

          $("tbSize").onchange = (e) => {
            const v = e.target.value;
            if (!v) return;
            applyCmd("fontSize", v);
            e.target.value = "";
          };

          $("tbColor").oninput = (e) => applyCmd("foreColor", e.target.value);

          $("tbTag").onclick = () => this._tagSelected();

          // imagem
          const tbImgFile = $("tbImgFile");

          $("tbImgIns").onclick = () => {
            if (!this.active) return;
            if (!this.savedRange) this._saveSelection();
            tbImgFile.value = "";
            tbImgFile.click();
          };

          tbImgFile.addEventListener("change", async () => {
            if (!this.active) return;
            if (!this.savedRange) this._saveSelection();
            if (!this._restoreSelection() && !this._selectionInsideActive())
              return;

            const file = tbImgFile.files && tbImgFile.files[0];
            if (!file) return;

            const dataUrl = await new Promise((resolve, reject) => {
              const fr = new FileReader();
              fr.onload = () => resolve(fr.result);
              fr.onerror = reject;
              fr.readAsDataURL(file);
            });

            this.active.focus({ preventScroll: true });

            const img = document.createElement("img");
            img.className = "rx-img";
            img.src = dataUrl;
            img.alt = file.name || "imagem";
            img.style.setProperty("--iw", "80px");

            this._insertImageInCurrentParagraphAtCaret(img);

            this._setActiveImg(img);
            this._saveSelection();
          });

          $("tbImgSm").onclick = () => this._resizeImg(-10);
          $("tbImgLg").onclick = () => this._resizeImg(10);

          // mover (LEFT/RIGHT) imagem/tabela
          $("tbImgLeft").onclick = () => {
            if (this.activeTbl) this._moveTblChar(-1);
            else this._moveImgChar(-1);
          };
          $("tbImgRight").onclick = () => {
            if (this.activeTbl) this._moveTblChar(1);
            else this._moveImgChar(1);
          };

          // tabela
          const MAX_TABLE_RC = 20;

          $("tbTblNew").onclick = () => {
            if (!this.active) return;

            const r1 = prompt(`Número de linhas (1..${MAX_TABLE_RC})`, "3");
            if (r1 == null) return;
            const rows = parseInt(r1, 10);

            const r2 = prompt(`Número de colunas (1..${MAX_TABLE_RC})`, "3");
            if (r2 == null) return;
            const cols = parseInt(r2, 10);

            if (!Number.isFinite(rows) || !Number.isFinite(cols)) return;
            if (rows < 1 || cols < 1) return;
            if (rows > MAX_TABLE_RC || cols > MAX_TABLE_RC) return;

            if (!this.savedRange) this._saveSelection();
            if (!this._restoreSelection() && !this._selectionInsideActive())
              return;

            this.active.focus({ preventScroll: true });
            this._insertTableAtCaret(rows, cols);
          };

          $("tbRowKind").onchange = (e) => {
            const kind = e.target.value || "";
            if (!this.activeTblRow) return;
            this._setRowKind(this.activeTblRow, kind);
          };

          let portrait = true;
          $("tbOrientation").onclick = () => {
            portrait = !portrait;
            const root = document.documentElement.style;
            if (portrait) {
              root.setProperty("--page-w", "210mm");
              root.setProperty("--page-h", "297mm");
            } else {
              root.setProperty("--page-w", "297mm");
              root.setProperty("--page-h", "210mm");
            }
          };

          const borderColor = () =>
            document.getElementById("tbColor")?.value || "#000";

          $("tbBorder").onchange = (e) => {
            const v = e.target.value;
            if (v === "") return;
            const cssBorder =
              v === "none" ? "none" : `${v}px solid ${borderColor()}`;
            this._applyBorder(cssBorder);
            e.target.value = "";
          };

          $("tbRadius").onchange = (e) => {
            const v = e.target.value;
            if (v === "") return;
            this._applyRadius(v + "px");
            e.target.value = "";
          };
        }

        _selectionInsideActive() {
          if (!this.active) return false;
          const sel = window.getSelection();
          if (!sel || sel.rangeCount === 0) return false;
          const r = sel.getRangeAt(0);
          const a =
            r.commonAncestorContainer.nodeType === 3
              ? r.commonAncestorContainer.parentNode
              : r.commonAncestorContainer;
          return this.active.contains(a);
        }

        _onSelectionChange() {
          if (!this.active) return;
          if (!this._selectionInsideActive()) return;
          this._saveSelection();
        }

        _saveSelection() {
          const sel = window.getSelection();
          if (sel && sel.rangeCount)
            this.savedRange = sel.getRangeAt(0).cloneRange();
        }

        _restoreSelection() {
          if (!this.savedRange) return false;
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(this.savedRange);
          return true;
        }

        /* ===== IMAGEM ===== */

        _setActiveImg(img) {
          if (this.activeImg && this.activeImg !== img)
            this.activeImg.classList.remove("sel");
          this.activeImg = img || null;
          if (this.activeImg) this.activeImg.classList.add("sel");
          if (img?.dataset?.img) img.title = `{{${img.dataset.img}}}`;
        }

        _clearActiveImg() {
          if (this.activeImg) this.activeImg.classList.remove("sel");
          this.activeImg = null;
        }

        _getTargetImg() {
          if (
            this.activeImg &&
            this.active &&
            this.active.contains(this.activeImg)
          )
            return this.activeImg;

          const r = this.savedRange || this._getSelectionRange();
          if (!r || !this.active) return null;
          const node =
            r.commonAncestorContainer.nodeType === 3
              ? r.commonAncestorContainer.parentNode
              : r.commonAncestorContainer;
          return node.closest?.("img.rx-img") || null;
        }

        _insertImageInCurrentParagraphAtCaret(img) {
          const r = this._getSelectionRange();
          const p = this._getActiveParagraph();
          if (!r || !p) return;

          if (!r.collapsed) r.collapse(true);
          r.insertNode(img);

          const spacer = document.createTextNode("\u00A0");
          img.after(spacer);

          const nr = document.createRange();
          nr.setStartAfter(spacer);
          nr.collapse(true);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(nr);
          this._saveSelection();
        }

        _getTextOffsetBeforeNode(container, node) {
          const r = document.createRange();
          r.selectNodeContents(container);
          r.setEndBefore(node);
          return r.toString().length;
        }

        _getTextLength(container) {
          const r = document.createRange();
          r.selectNodeContents(container);
          return r.toString().length;
        }

        _insertNodeAtTextOffset(container, node, offset) {
          const total = this._getTextLength(container);
          if (offset < 0) offset = 0;
          if (offset > total) offset = total;

          const tw = document.createTreeWalker(
            container,
            NodeFilter.SHOW_TEXT,
            null,
          );
          let cur;
          let remaining = offset;

          while ((cur = tw.nextNode())) {
            const len = cur.nodeValue.length;

            if (remaining <= len) {
              if (remaining === 0) {
                cur.parentNode.insertBefore(node, cur);
              } else if (remaining === len) {
                cur.parentNode.insertBefore(node, cur.nextSibling);
              } else {
                const right = cur.splitText(remaining);
                right.parentNode.insertBefore(node, right);
              }
              return;
            }
            remaining -= len;
          }
          container.appendChild(node);
        }

        _cleanupEmptyTextNodes(p) {
          const toRemove = [];
          for (const n of p.childNodes) {
            if (n.nodeType !== 3) continue;
            const t = (n.nodeValue || "").replace(/\u00A0/g, "");
            if (t === "") toRemove.push(n);
          }
          toRemove.forEach((n) => n.remove());
          if (
            !p.textContent.trim() &&
            p.querySelectorAll("img.rx-img").length === 0
          ) {
            p.innerHTML = "";
            p.appendChild(document.createElement("br"));
          }
        }

        _moveImgChar(dir) {
          if (!this.active) return;
          if (!this.savedRange) this._saveSelection();
          this.active.focus({ preventScroll: true });

          const img = this._getTargetImg();
          if (!img) return;

          const p = img.closest("p");
          if (!p) return;

          const pos = this._getTextOffsetBeforeNode(p, img);
          const total = this._getTextLength(p);

          img.remove();
          this._cleanupEmptyTextNodes(p);

          let nextPos = pos + dir;
          if (nextPos < 0) nextPos = 0;
          if (nextPos > total) nextPos = total;

          this._insertNodeAtTextOffset(p, img, nextPos);

          const r = document.createRange();
          r.setStartAfter(img);
          r.collapse(true);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
          this._saveSelection();

          this._setActiveImg(img);
        }

        _resizeImg(deltaPx) {
          if (!this.active) return;
          if (!this.savedRange) this._saveSelection();
          this.active.focus({ preventScroll: true });

          const img = this._getTargetImg();
          if (!img) return;

          const cur = (img.style.getPropertyValue("--iw") || "").trim();
          let w = 80;

          if (cur.endsWith("px")) w = parseFloat(cur);
          else w = Math.round(img.getBoundingClientRect().width);

          w = Math.max(20, w + deltaPx);
          img.style.setProperty("--iw", `${w}px`);

          this._setActiveImg(img);
          this._saveSelection();
        }

        /* ===== TABELA ===== */

        _setActiveTblRow(tblWrap, tr) {
          if (this.activeTblRow) this.activeTblRow.classList.remove("sel-row");
          if (this.activeTbl && this.activeTbl !== tblWrap)
            this.activeTbl.classList.remove("sel-table");

          this.activeTbl = tblWrap;
          this.activeTblRow = tr;

          tblWrap.classList.add("sel-table");
          tr.classList.add("sel-row");

          const sel = document.getElementById("tbRowKind");
          if (sel) sel.value = ""; // fica sempre na opção 0
        }

        _createTbl(rows, cols) {
          const wrap = document.createElement("div");
          wrap.className = "rx-tbl-wrap";
          wrap.dataset.cols = String(cols);
          wrap.contentEditable = "false";
          wrap.tabIndex = 0;

          const table = document.createElement("table");
          table.className = "rx-tbl";

          const tb = document.createElement("tbody");

          for (let r = 0; r < rows; r++) {
            const tr = document.createElement("tr");
            tr.dataset.kind = "detail";

            for (let c = 0; c < cols; c++) {
              const td = document.createElement("td");
              td.contentEditable = "true";
              td.appendChild(document.createElement("br"));
              tr.appendChild(td);
            }
            tb.appendChild(tr);
          }

          table.appendChild(tb);
          wrap.appendChild(table);
          return wrap;
        }

        _setRowKind(tr, kind) {
          if (kind === "titles" || kind === "detail") {
            const tbl = tr.closest(".rx-tbl");
            const other = tbl.querySelector(`tr[data-kind="${kind}"]`);
            if (other && other !== tr) other.dataset.kind = "";
          }
          if (!tr) return;

          tr.dataset.kind = kind || "";

          const wrap = tr.closest(".rx-tbl-wrap");
          const cols = parseInt(wrap?.dataset?.cols || "1", 10);

          if (kind === "group" || kind === "total") {
            const tds = tr.querySelectorAll(":scope > td");
            if (tds.length === 1 && tds[0].colSpan === cols) {
              const sel = document.getElementById("tbRowKind");
              if (sel) sel.value = "";
              return;
            }

            const td = document.createElement("td");
            td.colSpan = cols;
            td.contentEditable = "true";
            td.appendChild(document.createElement("br"));
            tr.innerHTML = "";
            tr.appendChild(td);

            const sel = document.getElementById("tbRowKind");
            if (sel) sel.value = "";
            return;
          }

          const tds = tr.querySelectorAll(":scope > td");
          if (tds.length === cols) {
            const sel = document.getElementById("tbRowKind");
            if (sel) sel.value = "";
            return;
          }

          tr.innerHTML = "";
          for (let c = 0; c < cols; c++) {
            const td = document.createElement("td");
            td.contentEditable = "true";
            td.appendChild(document.createElement("br"));
            tr.appendChild(td);
          }

          const sel = document.getElementById("tbRowKind");
          if (sel) sel.value = "";
        }

        _insertTableAtCaret(rows, cols) {
          const r = this._getSelectionRange();
          const p = this._getActiveParagraph();
          if (!r || !p) return;

          if (!r.collapsed) r.collapse(true);

          const wrap = this._createTbl(rows, cols);
          r.insertNode(wrap);

          const spacer = document.createTextNode("\u00A0");
          wrap.after(spacer);

          const nr = document.createRange();
          nr.setStartAfter(spacer);
          nr.collapse(true);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(nr);
          this._saveSelection();

          this._clearActiveTable();
          this._setActiveTable(wrap); // seleciona só a tabela (sem linha/célula)
        }

        _setActiveTblCell(tblWrap, td) {
          if (this.activeTblCell)
            this.activeTblCell.classList.remove("sel-cell");
          if (this.activeTblRow) this.activeTblRow.classList.remove("sel-row");
          if (this.activeTbl && this.activeTbl !== tblWrap)
            this.activeTbl.classList.remove("sel-table");

          this.activeTbl = tblWrap;
          this.activeTblCell = td;
          this.activeTblRow = td.closest("tr") || null;

          tblWrap.classList.add("sel-table");
          td.classList.add("sel-cell");

          const sel = document.getElementById("tbRowKind");
          if (sel) sel.value = ""; // não “puxa” o tipo ao clicar em célula/linha
        }

        _setActiveTable(tblWrap) {
          if (this.activeTblCell)
            this.activeTblCell.classList.remove("sel-cell");
          if (this.activeTblRow) this.activeTblRow.classList.remove("sel-row");
          if (this.activeTbl && this.activeTbl !== tblWrap)
            this.activeTbl.classList.remove("sel-table");

          this.activeTbl = tblWrap;
          this.activeTblRow = null;
          this.activeTblCell = null;

          tblWrap.classList.add("sel-table");

          const sel = document.getElementById("tbRowKind");
          if (sel) sel.value = "";
          if (tblWrap?.dataset?.items)
            tblWrap.title = `{{${tblWrap.dataset.items}}}`;
        }

        _getTargetTbl() {
          if (
            this.activeTbl &&
            this.active &&
            this.active.contains(this.activeTbl)
          )
            return this.activeTbl;

          const r = this.savedRange || this._getSelectionRange();
          if (!r || !this.active) return null;

          const node =
            r.commonAncestorContainer.nodeType === 3
              ? r.commonAncestorContainer.parentNode
              : r.commonAncestorContainer;

          return node.closest?.(".rx-tbl-wrap") || null;
        }

        _moveTblChar(dir) {
          if (!this.active) return;
          if (!this.savedRange) this._saveSelection();
          this.active.focus({ preventScroll: true });

          const tbl = this._getTargetTbl();
          if (!tbl) return;

          const p = tbl.closest("p");
          if (!p) return;

          const pos = this._getTextOffsetBeforeNode(p, tbl);
          const total = this._getTextLength(p);

          tbl.remove();
          this._cleanupEmptyTextNodes(p);

          let nextPos = pos + dir;
          if (nextPos < 0) nextPos = 0;
          if (nextPos > total) nextPos = total;

          this._insertNodeAtTextOffset(p, tbl, nextPos);

          const r = document.createRange();
          r.setStartAfter(tbl);
          r.collapse(true);
          const s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
          this._saveSelection();

          this._setActiveTable(tbl);
        }

        _getCommandHost() {
          const r = this.savedRange || this._getSelectionRange();
          if (!r) return this.active;

          const node =
            r.commonAncestorContainer.nodeType === 3
              ? r.commonAncestorContainer.parentNode
              : r.commonAncestorContainer;

          const td = node.closest?.(
            "td[contenteditable='true'], td[contenteditable=true]",
          );
          if (td) return td;

          return this.active;
        }

        /* ===== Borda / Raio ===== */

        _applyBorder(cssBorder) {
          const img = this._getTargetImg();
          if (img) {
            img.style.border = cssBorder === "none" ? "" : cssBorder;
            return;
          }

          // ===== 1) CÉLULA =====
          if (this.activeTblCell) {
            // célula: moldura da própria célula
            this.activeTblCell.style.border =
              cssBorder === "none" ? "" : cssBorder;
            return;
          }

          // ===== 2) LINHA =====
          if (this.activeTbl && this.activeTblRow) {
            const tds = [...this.activeTblRow.querySelectorAll(":scope > td")];
            if (!tds.length) return;

            // só moldura externa da linha (top/bottom em todas as células,
            // left só na primeira, right só na última)
            tds.forEach((td, i) => {
              if (cssBorder === "none") {
                td.style.borderTop = "";
                td.style.borderBottom = "";
                if (i === 0) td.style.borderLeft = "";
                if (i === tds.length - 1) td.style.borderRight = "";
              } else {
                td.style.borderTop = cssBorder;
                td.style.borderBottom = cssBorder;
                if (i === 0) td.style.borderLeft = cssBorder;
                if (i === tds.length - 1) td.style.borderRight = cssBorder;
              }
            });

            return;
          }

          // ===== 3) COLUNA =====
          if (this.activeTbl && this.activeTblCol != null) {
            const tbl = this.activeTbl.querySelector("table.rx-tbl");
            if (!tbl) return;

            const rows = [...tbl.querySelectorAll("tr")];

            // pega as TDs da coluna em cada TR (pula linhas sem TD naquela posição)
            const colTds = rows
              .map(
                (tr) => tr.querySelectorAll(":scope > td")[this.activeTblCol],
              )
              .filter(Boolean);

            if (!colTds.length) return;

            const first = colTds[0];
            const last = colTds[colTds.length - 1];

            colTds.forEach((td) => {
              if (cssBorder === "none") {
                td.style.borderLeft = "";
                td.style.borderRight = "";
              } else {
                td.style.borderLeft = cssBorder;
                td.style.borderRight = cssBorder;
              }
            });

            if (cssBorder === "none") {
              first.style.borderTop = "";
              last.style.borderBottom = "";
            } else {
              first.style.borderTop = cssBorder;
              last.style.borderBottom = cssBorder;
            }

            return;
          }

          // ===== 4) TABELA (só contorno externo) =====
          if (this.activeTbl) {
            // borda externa fica no WRAP
            this.activeTbl.style.border = cssBorder === "none" ? "" : cssBorder;

            // importante: não aplicar nas células (senão vira grade)
            // e manter recorte do raio
            if (cssBorder === "none") {
              // se quiser, pode limpar bordas externas removidas por radius
              // mas aqui deixo neutro
            }

            return;
          }

          // ===== 5) Parágrafos =====
          this._applyBorderToParagraphs(cssBorder);
        }

        _applyBorderToParagraphs(cssBorder) {
          if (!this.active) return;

          const r = this._getSelectionRange() || this.savedRange;
          const ps = new Set();

          if (!r || r.collapsed) {
            const p = this._getActiveParagraph();
            if (p) ps.add(p);
          } else {
            const root =
              r.commonAncestorContainer.nodeType === 3
                ? r.commonAncestorContainer.parentNode
                : r.commonAncestorContainer;

            const container = root.closest(".editable") || this.active;

            container.querySelectorAll("p").forEach((p) => {
              const pr = document.createRange();
              pr.selectNodeContents(p);

              const endsBefore =
                r.compareBoundaryPoints(Range.END_TO_START, pr) <= 0;
              const startsAfter =
                r.compareBoundaryPoints(Range.START_TO_END, pr) >= 0;

              if (!endsBefore && !startsAfter) ps.add(p);
            });
          }

          ps.forEach((p) => {
            p.style.border = cssBorder === "none" ? "" : cssBorder;
          });
        }

        _applyRadius(radius) {
          const img = this._getTargetImg();
          if (img) {
            img.style.borderRadius = radius;
            img.style.overflow = radius === "0px" ? "" : "hidden";
            return;
          }

          const isZero = radius === "0px";

          // ===== 1) CÉLULA =====
          if (this.activeTblCell) {
            this.activeTblCell.style.borderRadius = isZero ? "" : radius;
            return;
          }

          // ===== 2) LINHA (retângulo da linha) =====
          if (this.activeTbl && this.activeTblRow) {
            const tds = [...this.activeTblRow.querySelectorAll(":scope > td")];
            if (!tds.length) return;

            const first = tds[0];
            const last = tds[tds.length - 1];

            // só 4 quinas da linha
            first.style.borderTopLeftRadius = isZero ? "" : radius;
            first.style.borderBottomLeftRadius = isZero ? "" : radius;

            last.style.borderTopRightRadius = isZero ? "" : radius;
            last.style.borderBottomRightRadius = isZero ? "" : radius;

            return;
          }

          // ===== 3) COLUNA (retângulo da coluna) =====
          if (this.activeTbl && this.activeTblCol != null) {
            const tbl = this.activeTbl.querySelector("table.rx-tbl");
            if (!tbl) return;

            const rows = [...tbl.querySelectorAll("tr")];
            const colTds = rows
              .map(
                (tr) => tr.querySelectorAll(":scope > td")[this.activeTblCol],
              )
              .filter(Boolean);

            if (!colTds.length) return;

            const first = colTds[0];
            const last = colTds[colTds.length - 1];

            // só 4 quinas da coluna
            first.style.borderTopLeftRadius = isZero ? "" : radius;
            first.style.borderTopRightRadius = isZero ? "" : radius;

            last.style.borderBottomLeftRadius = isZero ? "" : radius;
            last.style.borderBottomRightRadius = isZero ? "" : radius;

            return;
          }

          // ===== 4) TABELA (raio no wrapper) =====
          if (this.activeTbl) {
            this.activeTbl.style.borderRadius = isZero ? "" : radius;
            this.activeTbl.style.overflow = isZero ? "" : "hidden";
            return;
          }

          // ===== 5) Parágrafo =====
          this._applyRadiusToParagraphs(radius);
        }

        /* ===== helpers (tabela/linha/coluna) ===== */

        _tblApplyRadiusTable(wrap, radius) {
          // raio do "container" da tabela
          wrap.style.borderRadius = radius === "0px" ? "" : radius;
          wrap.style.overflow = radius === "0px" ? "" : "hidden";
          wrap.style.display = "inline-block";
        }

        _tblApplyRadiusRow(wrap, tr, radius) {
          if (!tr) return;
          const tds = [...tr.querySelectorAll(":scope > td")];
          if (!tds.length) return;

          // limpa raio anterior só nessa linha
          tds.forEach((td) => {
            if (td.dataset.userRadius === "1") return; // não mexe no que o usuário pôs na célula
            td.style.borderRadius = "";
            td.style.overflow = "";
          });

          if (radius === "0px") return;

          // cantos externos da "faixa" (linha)
          const first = tds[0];
          const last = tds[tds.length - 1];

          first.style.borderTopLeftRadius = radius;
          first.style.borderBottomLeftRadius = radius;
          first.style.overflow = "hidden";

          last.style.borderTopRightRadius = radius;
          last.style.borderBottomRightRadius = radius;
          last.style.overflow = "hidden";
        }

        _tblApplyRadiusCol(wrap, colIndex, radius) {
          const tbl = wrap?.querySelector("table.rx-tbl");
          if (!tbl) return;

          const rows = [...tbl.querySelectorAll("tr")];
          if (!rows.length) return;

          // pega a célula do topo e a do fundo dessa coluna
          const top = rows[0].querySelectorAll(":scope > td")[colIndex];
          const bottom =
            rows[rows.length - 1].querySelectorAll(":scope > td")[colIndex];
          if (!top || !bottom) return;

          // limpa raio anterior só nessas duas (se não for "manual" da célula)
          [top, bottom].forEach((td) => {
            if (td.dataset.userRadius === "1") return;
            td.style.borderRadius = "";
            td.style.overflow = "";
          });

          if (radius === "0px") return;

          top.style.borderTopLeftRadius = radius;
          top.style.borderTopRightRadius = radius;
          top.style.overflow = "hidden";

          bottom.style.borderBottomLeftRadius = radius;
          bottom.style.borderBottomRightRadius = radius;
          bottom.style.overflow = "hidden";
        }

        _applyRadiusToParagraphs(radius) {
          if (!this.active) return;

          const r = this._getSelectionRange() || this.savedRange;
          const ps = new Set();

          if (!r || r.collapsed) {
            const p = this._getActiveParagraph();
            if (p) ps.add(p);
          } else {
            const root =
              r.commonAncestorContainer.nodeType === 3
                ? r.commonAncestorContainer.parentNode
                : r.commonAncestorContainer;

            const container = root.closest(".editable") || this.active;

            container.querySelectorAll("p").forEach((p) => {
              const pr = document.createRange();
              pr.selectNodeContents(p);

              const endsBefore =
                r.compareBoundaryPoints(Range.END_TO_START, pr) <= 0;
              const startsAfter =
                r.compareBoundaryPoints(Range.START_TO_END, pr) >= 0;

              if (!endsBefore && !startsAfter) ps.add(p);
            });
          }

          ps.forEach((p) => {
            p.style.borderRadius = radius;
            p.style.overflow = radius === "0px" ? "" : "hidden";
          });
        }

        /* ===== TAG (img/tbl) ===== */

        _tagSelected() {
          if (this.activeImg) {
            const cur = this.activeImg.dataset.img || "";
            const v = prompt("Tag da imagem (ex: Logo)", cur);
            if (v == null) return;

            const tag = v.trim();
            if (!tag) {
              delete this.activeImg.dataset.img;
              this.activeImg.removeAttribute("title");
            } else {
              this.activeImg.dataset.img = tag;
              this.activeImg.title = `{{${tag}}}`;
            }
            return;
          }

          if (this.activeTbl) {
            const cur = this.activeTbl.dataset.items || "";
            const v = prompt("Coleção da tabela (ex: Itens)", cur);
            if (v == null) return;

            const tag = v.trim();
            if (!tag) {
              delete this.activeTbl.dataset.items;
              this.activeTbl.removeAttribute("title");
            } else {
              this.activeTbl.dataset.items = tag;
              this.activeTbl.title = `{{${tag}}}`;
            }
          }
        }

        _tblFixOuterEdgesForRounded(wrap, on) {
          const tbl = wrap?.querySelector("table.rx-tbl");
          if (!tbl) return;

          const rows = [...tbl.querySelectorAll("tr")];
          if (rows.length === 0) return;

          const firstRow = rows[0].querySelectorAll("td");
          const lastRow = rows[rows.length - 1].querySelectorAll("td");
          const lastColIndex = (firstRow.length || 1) - 1;

          // volta tudo ao normal
          tbl.querySelectorAll("td").forEach((td) => {
            td.style.borderTop = "";
            td.style.borderBottom = "";
            td.style.borderLeft = "";
            td.style.borderRight = "";
          });

          if (!on) return;

          // tira as bordas EXTERNAS (quem desenha o externo será o wrap)
          firstRow.forEach((td) => (td.style.borderTop = "none"));
          lastRow.forEach((td) => (td.style.borderBottom = "none"));

          rows.forEach((tr) => {
            const tds = tr.querySelectorAll("td");
            if (!tds.length) return;
            tds[0].style.borderLeft = "none";
            tds[lastColIndex]?.style &&
              (tds[lastColIndex].style.borderRight = "none");
          });
        }

        _tblApplyWrapBorder(wrap, cssBorder, radius) {
          wrap.style.border = cssBorder === "none" ? "" : cssBorder;
          wrap.style.borderRadius = radius || "0px";
          wrap.style.overflow = radius && radius !== "0px" ? "hidden" : "";
          wrap.style.display = "inline-block"; // garante
          this._tblFixOuterEdgesForRounded(wrap, radius && radius !== "0px");
        }

        _setActiveTblCol(tblWrap, colIndex) {
          // limpa seleções anteriores
          if (this.activeTblCell)
            this.activeTblCell.classList.remove("sel-cell");
          if (this.activeTblRow) this.activeTblRow.classList.remove("sel-row");
          if (this.activeTbl && this.activeTbl !== tblWrap) {
            this.activeTbl.classList.remove("sel-table");
            this.activeTbl
              .querySelectorAll("td.sel-col")
              .forEach((td) => td.classList.remove("sel-col"));
          }
          if (tblWrap)
            tblWrap
              .querySelectorAll("td.sel-col")
              .forEach((td) => td.classList.remove("sel-col"));

          this.activeTbl = tblWrap;
          this.activeTblRow = null;
          this.activeTblCell = null;
          this.activeTblCol = colIndex;

          tblWrap.classList.add("sel-table");

          const tbl = tblWrap.querySelector("table.rx-tbl");
          if (!tbl) return;

          // marca as células da coluna
          tbl.querySelectorAll("tr").forEach((tr) => {
            const tds = tr.querySelectorAll(":scope > td");
            const td = tds[colIndex];
            if (td) td.classList.add("sel-col");
          });

          const sel = document.getElementById("tbRowKind");
          if (sel) sel.value = ""; // você pediu pra não mexer no combo ao selecionar linha/coluna
        }

        _setActiveTableOnly(tblWrap) {
          this._clearActiveTable();
          this.activeTbl = tblWrap;
          tblWrap.classList.add("sel-table");

          const sel = document.getElementById("tbRowKind");
          if (sel) sel.value = "";
        }

        _cycleTblSelectionCtrl(tblWrap, tr, td) {
          // ciclo: table -> row -> col -> table ...
          // regra: usa o ponto clicado (tr/td) pra definir linha/coluna quando for o caso

          const sameTbl = this.activeTbl === tblWrap;

          const isTable =
            sameTbl &&
            this.activeTbl &&
            !this.activeTblRow &&
            !this.activeTblCell &&
            this.activeTblCol == null;
          const isRow = sameTbl && !!this.activeTblRow;
          const isCol = sameTbl && this.activeTblCol != null;
          // (cell é clique simples, então ctrl não entra como "cell mode")

          if (!sameTbl || (!isTable && !isRow && !isCol)) {
            // começa em "tabela"
            this._setActiveTableOnly(tblWrap);
            return;
          }

          if (isTable) {
            // table -> row
            if (tr) this._setActiveTblRow(tblWrap, tr);
            else this._setActiveTblRow(tblWrap, tblWrap.querySelector("tr"));
            return;
          }

          if (isRow) {
            // row -> col
            const colIndex = td ? td.cellIndex : 0;
            this._setActiveTblCol(tblWrap, colIndex);
            return;
          }

          // col -> table
          this._setActiveTableOnly(tblWrap);
        }

        _tblGetTable(wrap) {
          return wrap?.querySelector("table.rx-tbl") || null;
        }

        _tblGetAllRows(wrap) {
          const tbl = this._tblGetTable(wrap);
          if (!tbl) return [];
          return [...tbl.querySelectorAll("tr")];
        }

        _tblClearAutoBorders(wrap) {
          const tbl = this._tblGetTable(wrap);
          if (!tbl) return;

          tbl.querySelectorAll("td").forEach((td) => {
            // só apaga o que foi aplicado automaticamente (linha/coluna/tabela)
            if (td.dataset.autoBorder === "1") {
              td.style.borderTop = "";
              td.style.borderBottom = "";
              td.style.borderLeft = "";
              td.style.borderRight = "";
              td.style.border = "";
              delete td.dataset.autoBorder;
            }
          });
        }

        _tblApplyBorderTable(wrap, cssBorder) {
          // borda externa: no wrapper
          wrap.style.border = cssBorder === "none" ? "" : cssBorder;

          // limpa qualquer auto-borda interna (pra ficar só a moldura externa)
          this._tblClearAutoBorders(wrap);
        }

        _tblApplyBorderRow(wrap, tr, cssBorder) {
          if (!wrap || !tr) return;

          const tds = [...tr.querySelectorAll(":scope > td")];
          if (tds.length === 0) return;

          const last = tds.length - 1;
          const border = cssBorder === "none" ? "" : cssBorder;

          // NÃO mexe na borda do wrapper ao aplicar na linha
          // (a linha é um retângulo interno)

          for (let i = 0; i < tds.length; i++) {
            const td = tds[i];
            td.dataset.autoBorder = "1";

            // topo e base em toda célula da linha
            td.style.borderTop = border;
            td.style.borderBottom = border;

            // laterais só nas extremidades (pra não ter divisórias internas)
            td.style.borderLeft = i === 0 ? border : "none";
            td.style.borderRight = i === last ? border : "none";
          }
        }

        _tblApplyBorderCol(wrap, colIndex, cssBorder) {
          if (!wrap || colIndex == null) return;

          const rows = this._tblGetAllRows(wrap);
          if (rows.length === 0) return;

          const border = cssBorder === "none" ? "" : cssBorder;
          const lastRow = rows.length - 1;

          for (let r = 0; r < rows.length; r++) {
            const tr = rows[r];
            const td = tr.children?.[colIndex];
            if (!td) continue;

            td.dataset.autoBorder = "1";

            // laterais sempre
            td.style.borderLeft = border;
            td.style.borderRight = border;

            // topo só na primeira linha, base só na última
            td.style.borderTop = r === 0 ? border : "none";
            td.style.borderBottom = r === lastRow ? border : "none";
          }
        }

        _tblEnsureSeparate(wrap) {
          const tbl = wrap?.querySelector("table.rx-tbl");
          if (!tbl) return null;
          tbl.style.borderCollapse = "separate";
          tbl.style.borderSpacing = "0";
          return tbl;
        }
      }

      // boot
      (() => {
        const wordex = new WordexEditor({
          stage: document.getElementById("stage"),
          modePill: document.getElementById("modePill"),
          modeText: document.getElementById("modeText"),
        });
        wordex.init();
      })();
    </script>
  </body>
</html>
